/* ══ 布局引擎(逐字镜像产品 loginScale.ts;oracle=truth.adaptive.samples) ══ */
let FRAME = { w: 1280, h: 800 };
function desktopScale(w, h){ return Math.min(1, h / SH, (w - 24) / G.loginGroup.width); }
function panelPlacement(w, h, groupY, reserve){
  const brand = desktopScale(w, h);
  const panelH = G.loginGroup.height * FS;
  const anchor = h / 2 + (groupY + G.loginGroup.height / 2 - SH / 2) * brand;
  const brandBottom = h / 2 + ((G.hero.y + G.hero.size) - SH / 2) * brand;
  let topY = anchor - panelH / 2;
  topY = Math.max(topY, brandBottom + 24);
  topY = Math.min(topY, h - 24 - panelH - reserve);
  topY = Math.max(topY, 24);
  return { scale: FS, centerX: w / 2 + ((G.loginGroup.x + G.loginGroup.width / 2) - SW / 2) * FS, topY };
}
function brandPlacement(w, h, reserve){
  const base = desktopScale(w, h);
  const panelTop = panelPlacement(w, h, G.loginGroup.yDefault, reserve).topY;
  const blockTop = h / 2 + (G.hero.y - SH / 2) * base;
  const blockBottom = h / 2 + ((G.hero.y + G.hero.size) - SH / 2) * base;
  const limit = panelTop - 12;
  const overflow = blockBottom - limit;
  if (overflow <= 0) return { scale: base, translateY: 0, tier: '常态' };
  const maxShift = blockTop - 12;
  if (overflow <= maxShift) return { scale: base, translateY: -overflow, tier: '上移档' };
  const s2 = Math.max(limit - 12, 0) / G.hero.size;
  const blockTop2 = h / 2 + (G.hero.y - SH / 2) * s2;
  return { scale: s2, translateY: 12 - blockTop2, tier: '压缩档' };
}

/* ══ 帧内交互绑定 ══ */
function bindFrameEvents(){
  const q = (sel) => frame.querySelector(sel);
  const input = q('.lp-panel-identifier .lp-input, .lp-panel-sso-org .lp-input, .lp-panel-binding input.lp-input:not(.lp-code-input)');
  // identifier / sso-org / binding request 输入(直改 DOM,不重渲染 — 输入连续性)
  const bindTextInput = (el, get, set) => {
    if (!el) return;
    el.addEventListener('input', () => {
      set(el.value);
      if (S.formatError) { S.formatError = null; const et = q('.lp-error-text'); if (et) et.remove(); }
      const filled = el.value.length > 0;
      el.style.fontWeight = filled ? '700' : '400';
      el.style.color = filled ? C('controlText') : C('controlPlaceholder');
      if (!S.formatError) el.style.borderColor = filled ? C('controlBorderActive') : C('controlBorder');
      const btn = q('.lp-primary-btn');
      if (btn) btn.disabled = !el.value.trim();
    });
  };
  if (S.step === 'identifier' && !S.ssoOrgMode) {
    bindTextInput(q('.lp-panel-identifier .lp-input'), null, (v) => { S.identifier = v; });
    const submit = () => {
      const value = S.identifier.trim();
      if (!value) return;
      if (idKind() === 'email') {
        if (!isValidEmail(value)) { S.formatError = 'email'; render(); return; }
        requireConsent(() => { // discover 仿真:@acme=org / @ssoonly=ssoRequired / 其它=个人行
          if (/@ssoonly\./.test(value)) { S.step='method-choice.ssoRequired'; S.ctx={ email:value, orgName:SAMPLE.ssoOnlyOrg, conn:SAMPLE.ssoOnlyOrg, ssoRequired:true, fromSsoOrg:false }; }
          else if (/@acme\./.test(value)) { S.step='method-choice'; S.ctx={ email:value, orgName:SAMPLE.org, conn:SAMPLE.conn, ssoRequired:false, fromSsoOrg:false }; }
          else { S.step='method-choice'; S.ctx={ email:value, orgName:null, personalOnly:true, fromSsoOrg:false }; }
          render();
        });
      } else {
        requireConsent(() => { S.step='verify'; S.ctx.identifier = value; S.code=''; S.error=null; armCountdown(); render(); });
      }
    };
    q('.lp-primary-btn')?.addEventListener('click', submit);
    q('.lp-consent-radio')?.addEventListener('click', () => { S.consent = !S.consent; render(); });
    q('.lp-social-sso')?.addEventListener('click', () => { S.step='sso-org'; S.ssoOrg=''; render(); });
    q('.lp-skip-entry')?.addEventListener('click', () => requireConsent(() => { S.step='main'; render(); }));
    for (const p of ['apple','google','wechat']) {
      q('.lp-social-' + p)?.addEventListener('click', () =>
        requireConsent(() => { S.step='browser-redirect'; S.ctx.label = t('social.' + p); render(); }));
    }
  }
  if (S.step === 'sso-org') {
    bindTextInput(q('.lp-panel-sso-org .lp-input'), null, (v) => { S.ssoOrg = v; });
    q('.lp-back')?.addEventListener('click', () => { S.step='identifier'; render(); });
    q('.lp-primary-btn')?.addEventListener('click', () => {
      const v = S.ssoOrg.trim(); if (!v) return;
      S.step='method-choice'; S.ctx={ email:null, orgName:v, conn:v, ssoRequired:false, fromSsoOrg:true }; render();
    });
  }
  if (S.step === 'verify') {
    const code = q('.lp-code-input');
    code?.addEventListener('input', () => {
      code.value = code.value.replace(/\D/g, '');
      S.code = code.value;
      const filled = code.value.length > 0;
      code.style.fontWeight = filled ? '700' : '400';
      code.style.color = filled || S.error ? C('controlText') : C('controlPlaceholder');
      const btn = q('.lp-primary-btn'); if (btn) btn.disabled = S.code.length !== 6;
    });
    q('.lp-back')?.addEventListener('click', () => { resetFlow(); render(); });
    q('.lp-primary-btn')?.addEventListener('click', () => {
      if (S.code.length !== 6) return;
      if (S.code === '123456') { S.step='main'; render(); }
      else { S.error = 'INVALID_CODE'; render(); }
    });
    frame.addEventListener('click', (e) => {
      if (e.target.closest('.lp-resend-link')) { S.error=null; armCountdown(); renderVerifyLinkSlot(); }
    });
  }
  if (S.step === 'method-choice' || S.step === 'method-choice.ssoRequired') {
    q('.lp-back')?.addEventListener('click', () => { resetFlow(); render(); });
    q('.lp-method-sso')?.addEventListener('click', () => { S.step='browser-redirect'; S.ctx={ label: S.ctx.conn }; render(); });
    q('.lp-method-personal')?.addEventListener('click', () => {
      const email = S.ctx.email;
      requireConsent(() => { S.step='verify'; S.ctx={ identifier: email }; S.code=''; S.error=null; armCountdown(); render(); });
    });
  }
  if (S.step === 'account-selection' || S.step === 'sso-verification' || S.step === 'binding') {
    q('.lp-back')?.addEventListener('click', () => { resetFlow(); render(); });
  }
  if (S.step === 'browser-redirect') q('.lp-cancel-browser')?.addEventListener('click', () => { resetFlow(); render(); });
  if (S.step === 'error') q('.lp-error-retry')?.addEventListener('click', () => { resetFlow(); render(); });
  if (S.dialog) {
    q('.lp-dialog-agree')?.addEventListener('click', () => {
      S.consent = true; S.dialog = false;
      const pending = S.pending; S.pending = null;
      if (pending) pending(); else render();
    });
    q('.lp-dialog-disagree')?.addEventListener('click', () => { S.dialog = false; S.pending = null; render(); });
  }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.dialog) { S.dialog = false; S.pending = null; render(); }
});

const LANGUAGE_LABELS = {'zh-CN':'中','zh-TW':'繁',en:'EN',ja:'日',ko:'한'};
function languageOptions(locales, copy){
  const ordered = locales.filter((locale) => Object.prototype.hasOwnProperty.call(copy, locale));
  const seen = new Set(ordered);
  return ordered.concat(Object.keys(copy).filter((locale) => !seen.has(locale)))
    .map((locale) => [locale, LANGUAGE_LABELS[locale] ?? locale]);
}
const SEGS = [
  ['plat', '端', [['desk','桌面']]],

  ['preparing','准备态','loginState 就绪前的启动中间帧'],
  ['verify.resend','重发链接态','42s 倒计时归零后的可重发形态'],

  ['binding.request','绑定联系方式','社交登录缺联系方式时'],
  ['binding.code','绑定验证码子态','绑定发码后'],
  ['error','服务不可用','登录服务故障整页错误态'],
];
let tabOpen = false;
function renderChrome(){
  const meta = { what: '当前产品桌面登录链路全状态高保真 QA demo', how: 'truth 由 extract.mjs 从产品源码机械提取,布局公式 oracle=loginScale.ts', accept: 'A-D/F 门自动验收;门 E 无沙盒基准如实标注' };

  const bar = document.getElementById('qa-bar');
  let html = '';
  for (const [key, label, opts] of SEGS) {
    html += `<span class="qa-seg"><span class="lbl">${label}</span>`;
    for (const [v, name] of opts)
      html += `<button data-qa-pref="${key}:${v}" class="${P[key] === v ? 'on' : ''}">${name}</button>`;
    html += '</span>';

  html += `<button class="qa-tab-btn ${tabOpen ? 'on' : ''}" data-qa-state-tab>状态补齐</button>`;

  ).join('');

/* ══ 帧拉伸(拖拽与 __qa.resize 同一路径) ══ */
function setFrameSize(w, h){
  FRAME = { w: Math.max(MIN_W, Math.round(w)), h: Math.max(MIN_H, Math.round(h)) };
  render();
}
for (const handle of document.querySelectorAll('.handle')) {
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const mode = handle.getAttribute('data-h');
    const startX = e.clientX, startY = e.clientY, w0 = FRAME.w, h0 = FRAME.h;
    const move = (ev) => setFrameSize(
      mode !== 'b' ? w0 + ev.clientX - startX : w0,
      mode !== 'r' ? h0 + ev.clientY - startY : h0);
    const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  });
}

/* ══ __qa 验收合约 ══ */
window.__qa = {
  current: () => currentState(),
  goto: (id) => { if (!STATE_IDS.includes(id)) throw new Error('unknown state: ' + id); gotoState(id); },
  prefs: () => ({ plat: P.plat, region: P.region, os: P.os, mode: P.mode, lang: P.lang }),
  scale: () => FS,
  resize: (w, h) => setFrameSize(w, h),
  metrics: (ids) => {
    const fr = frame.getBoundingClientRect();
    const out = { frame: { w: fr.width, h: fr.height }, probes: {} };
    for (const id of ids || []) {
      const el = frame.querySelector(id === 'panel' ? '.lp-stage' : '.' + id);
      out.probes[id] = el ? (({ x, y, width, height }) => ({ x: x - fr.x, y: y - fr.y, w: width, h: height }))(el.getBoundingClientRect()) : null;
    }
    return out;
  },
};

render();
</script>
</body>
</html>
