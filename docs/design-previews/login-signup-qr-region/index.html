<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cindy 登录：创建账号提示 · 扫码登录 · 版本不一致 — 交互原型</title>
<style>
/* ── 原型外壳 token（仅原型页面，非产品 token） ─────────────────────────── */
:root {
  --page: #E9E9E4; --card: #FDFDF8; --ink: rgba(0,0,0,.88); --ink2: rgba(0,0,0,.56); --ink3: rgba(0,0,0,.36);
  --line: rgba(0,0,0,.08); --chip: rgba(0,0,0,.05); --chip-on: #3C3F43; --chip-on-fg: #FCFCFC;
  --mark: #2F6BFF; --mark-soft: rgba(47,107,255,.10); --tune: #B26A00; --tune-soft: rgba(178,106,0,.10);
  --device: #111;
  /* 登录域 token：取值同 docs/design-rules/login-flow.md §16.1 */
  --l-bg: #F2F2ED; --l-panel: #FDFDF8; --l-panel-border: rgba(0,0,0,.08);
  --l-control: rgba(0,0,0,.05); --l-control-border: rgba(0,0,0,.08); --l-control-border-active: rgba(0,0,0,.88);
  --l-title: rgba(0,0,0,.88); --l-text2: rgba(0,0,0,.56); --l-placeholder: rgba(0,0,0,.32);
  --l-btn: #3C3F43; --l-btn-text: #FCFCFC; --l-link: rgba(0,0,0,.88); --l-error: #D91F37; --l-brand: #DF0C27;
  --l-ring: rgba(0,0,0,.10); --l-scrim: rgba(0,0,0,.32);
  /* 主界面示意 */
  --a-bg: #F2F2ED; --a-side: #EAEAE4; --a-card: #FDFDF8; --a-text: rgba(0,0,0,.88); --a-text2: rgba(0,0,0,.56);
  --a-line: rgba(0,0,0,.08); --a-chip: rgba(0,0,0,.05);
}
[data-theme="dark"] {
  --page: #0E0E0E; --card: #1A1A1A; --ink: rgba(255,255,255,.86); --ink2: rgba(255,255,255,.56); --ink3: rgba(255,255,255,.34);
  --line: rgba(255,255,255,.10); --chip: rgba(255,255,255,.06); --chip-on: #EEEEEE; --chip-on-fg: #151515;
  --mark: #6E98FF; --mark-soft: rgba(110,152,255,.14); --tune: #F0A640; --tune-soft: rgba(240,166,64,.14);
  --device: #000;
  --l-bg: #181818; --l-panel: #1F1F1F; --l-panel-border: rgba(255,255,255,.10);
  --l-control: rgba(255,255,255,.06); --l-control-border: rgba(255,255,255,.10); --l-control-border-active: rgba(255,255,255,.82);
  --l-title: rgba(255,255,255,.82); --l-text2: rgba(255,255,255,.55); --l-placeholder: rgba(255,255,255,.30);
  --l-btn: #EEEEEE; --l-btn-text: #151515; --l-link: rgba(255,255,255,.82);
  --l-ring: rgba(255,255,255,.13); --l-scrim: rgba(0,0,0,.55);
  --a-bg: #181818; --a-side: #141414; --a-card: #1F1F1F; --a-text: rgba(255,255,255,.82); --a-text2: rgba(255,255,255,.55);
  --a-line: rgba(255,255,255,.10); --a-chip: rgba(255,255,255,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

/* ── 顶部 ── */
.top { padding: 20px 24px 8px; max-width: 1480px; margin: 0 auto; }
.top h1 { margin: 0 0 6px; font-size: 20px; line-height: 1.3; font-weight: 700; }
.top p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink2); max-width: 980px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--ink2); align-items: center; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.tag.new { background: var(--mark-soft); color: var(--mark); }
.tag.tune { background: var(--tune-soft); color: var(--tune); }
.tag.keep { background: var(--chip); color: var(--ink2); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 10px 24px 14px; max-width: 1480px; margin: 0 auto; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl > span { font-size: 12px; color: var(--ink2); white-space: nowrap; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); font-weight: 600; }
.reset { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; box-shadow: inset 0 0 0 1px var(--line); background: var(--card); }

/* ── 工作区 ── */
.workspace { display: grid; grid-template-columns: 210px minmax(0,1fr) 320px; gap: 16px; padding: 0 24px 32px; max-width: 1480px; margin: 0 auto; align-items: start; }
.steps, .notes { background: var(--card); border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line); padding: 14px; position: sticky; top: 12px; }
.steps h3, .notes h3 { margin: 4px 4px 10px; font-size: 12px; font-weight: 600; color: var(--ink2); }
.steps .grp { margin: 12px 4px 6px; font-size: 11px; color: var(--ink3); }
.steps button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 8px 10px; border-radius: 12px; font-size: 13px; line-height: 1.3; }
.steps button:hover { background: var(--chip); }
.steps button[aria-current="step"] { background: var(--chip-on); color: var(--chip-on-fg); }
.steps button[aria-current="step"] .tag { background: rgba(255,255,255,.18); color: inherit; }
[data-theme="dark"] .steps button[aria-current="step"] .tag { background: rgba(0,0,0,.12); }
.workspace.wide { grid-template-columns: minmax(0,1fr) 300px; }
.workspace.wide .steps { display: none; }
.nexthint { font-size: 13px; color: var(--ink); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; padding: 6px 14px; }
.nexthint b { color: var(--mark); font-weight: 600; margin-right: 6px; }
.canvas { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.stagewrap { position: relative; }
.stagewrap > .scaled { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.demo { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 760px; }
.demo .lbl { font-size: 12px; color: var(--ink3); align-self: center; }
.demo button { height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: var(--mark); background: var(--mark-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mark) 35%, transparent); }
.notes .ttl { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; font-size: 16px; font-weight: 700; }
.notes .sec { margin: 12px 4px 0; }
.notes .sec b { display: block; font-size: 12px; color: var(--ink2); font-weight: 600; margin-bottom: 4px; }
.notes .sec p, .notes .sec li { font-size: 13px; line-height: 1.6; margin: 0; }
.notes .sec ul { margin: 0; padding-left: 18px; }
.notes code { font-size: 12px; background: var(--chip); padding: 1px 5px; border-radius: 6px; }
.devlabel { font-size: 12px; color: var(--ink2); text-align: center; margin-bottom: 8px; }
.duo { display: flex; gap: 28px; align-items: flex-start; justify-content: center; flex-wrap: nowrap; }

@media (max-width: 760px) {
  .seg { flex-wrap: wrap; border-radius: 18px; }
  .controls { padding: 10px 16px 14px; } .top { padding: 16px 16px 8px; } .workspace { padding: 0 16px 24px; }
}
@media (max-width: 1180px) {
  .workspace, .workspace.wide { grid-template-columns: minmax(0,1fr); }
  .steps, .notes { position: static; }
  .steps { order: 2; } .canvas { order: 1; } .notes { order: 3; }
  .steps .list { display: flex; flex-wrap: wrap; gap: 4px; }
  .steps button { width: auto; }
  .steps .grp { flex-basis: 100%; }
}

/* ── 设备外框 ── */
.phone { width: 414px; height: 868px; border-radius: 64px; background: var(--device); padding: 12px; box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset; }
.screen { position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden; background: var(--l-bg); }
.statusbar { position: absolute; z-index: 30; left: 0; right: 0; top: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px 0 40px; font-size: 15px; font-weight: 600; color: var(--l-title); pointer-events: none; }
.statusbar.light-on-dark { color: #fff; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.island { position: absolute; z-index: 31; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
.homebar { position: absolute; z-index: 31; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--l-title); opacity: .9; pointer-events: none; }
.homebar.light-on-dark { background: #fff; }

.window { border-radius: 12px; overflow: hidden; background: var(--l-bg); box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.16); }
.titlebar { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--l-bg); position: relative; z-index: 5; }
.titlebar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.titlebar i:nth-child(1) { background: #FF5F57; } .titlebar i:nth-child(2) { background: #FEBC2E; } .titlebar i:nth-child(3) { background: #28C840; }
.wbody { position: relative; overflow: hidden; }

/* ── 登录舞台（设计单位，外层统一缩放） ── */
.mstage { position: absolute; left: 0; top: 0; width: 750px; height: 1624px; transform-origin: 0 0; background: var(--l-bg); }
.mstage img, .dcluster img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }
.lgroup { position: absolute; width: 680px; }
.panel { position: relative; width: 680px; background: var(--l-panel); border-radius: 36px; box-shadow: inset 0 0 0 1px var(--l-panel-border); }
.panel > * { position: absolute; }
.lp-back { left: 20px; top: 20px; width: 60px; height: 60px; border-radius: 40px; background: var(--l-control); box-shadow: inset 0 0 0 1px var(--l-control-border); display: grid; place-items: center; color: var(--l-title); }
.lp-back svg { width: 28px; height: 28px; }
.lp-title { left: 90px; right: 90px; top: 31px; height: 38px; line-height: 38px; font-size: 32px; font-weight: 700; text-align: center; color: var(--l-title); white-space: nowrap; display: flex; justify-content: center; align-items: center; gap: 2px; }
.lp-pill { display: inline-flex; align-items: center; height: 30px; padding: 0 11px; border-radius: 40px; background: var(--l-brand); color: #fff; font-size: 16px; font-weight: 700; margin-left: 6px; }
.lp-sub { left: 70px; top: 75px; width: 540px; font-size: 20px; line-height: 25px; color: var(--l-text2); max-height: 50px; overflow: hidden; }
.lp-sub strong { color: var(--l-title); font-weight: 600; }
.lp-input { left: 70px; top: 158px; width: 540px; height: 80px; border-radius: 40px; background: var(--l-control); box-shadow: inset 0 0 0 2px var(--l-control-border); font-size: 24px; font-weight: 700; padding: 0 40px; display: flex; align-items: center; color: var(--l-placeholder); text-align: left; }
.lp-input.filled { color: var(--l-title); box-shadow: inset 0 0 0 2px var(--l-control-border-active); }
.lp-input.center { justify-content: center; letter-spacing: 6px; }
.lp-link { left: 70px; top: 238px; width: 540px; height: 50px; font-size: 20px; display: flex; align-items: center; color: var(--l-text2); }
.lp-link.center { justify-content: center; }
.lp-link button { color: var(--l-link); text-decoration: underline; font-size: 20px; }
.lp-btn { left: 70px; top: 300px; width: 540px; height: 80px; border-radius: 40px; background: var(--l-btn); color: var(--l-btn-text); font-size: 24px; font-weight: 700; }
.lp-btn2 { background: var(--l-control); color: var(--l-title); box-shadow: inset 0 0 0 1px var(--l-control-border); }
.lp-input .pre { margin-right: 18px; padding-right: 18px; box-shadow: inset -2px 0 0 var(--l-control-border); color: var(--l-title); }
.lp-btn[disabled] { background: var(--l-control); color: var(--l-placeholder); cursor: default; }
.lp-row { left: 70px; width: 540px; height: 100px; border-radius: 60px; background: var(--l-control); box-shadow: inset 0 0 0 1px var(--l-control-border); text-align: left; padding: 0 70px 0 76px; display: flex; flex-direction: column; justify-content: center; color: var(--l-title); }
.lp-row .ic { position: absolute; left: 27px; top: 34px; width: 32px; height: 32px; color: var(--l-title); }
.lp-row .chev { position: absolute; left: 490px; top: 38px; width: 24px; height: 24px; color: var(--l-text2); }
.lp-row .t { font-size: 24px; line-height: 30px; font-weight: 700; white-space: nowrap; }
.lp-row .s { font-size: 20px; line-height: 26px; color: var(--l-text2); white-space: nowrap; }
.lp-err { left: 0; top: 380px; width: 680px; height: 50px; text-align: center; font-size: 20px; line-height: 50px; color: var(--l-error); }
.lp-skip { left: 0; top: 430px; width: 680px; height: 60px; display: flex; justify-content: center; align-items: center; pointer-events: none; }
.lp-skip button { pointer-events: auto; font-size: 24px; color: var(--l-text2); text-decoration: underline; padding: 0 30px; height: 60px; }
.lp-ring { left: 300px; width: 80px; height: 80px; }
.lp-center { left: 70px; width: 540px; text-align: center; font-size: 20px; line-height: 26px; color: var(--l-text2); }
.ring { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--l-ring); border-top-color: var(--l-title); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.social { position: absolute; left: 0; width: 680px; display: flex; justify-content: center; gap: 70px; }
.soc { position: relative; width: 80px; height: 80px; border-radius: 50px; background: var(--l-btn); color: var(--l-btn-text); display: grid; place-items: center; }
.soc svg { width: 44px; height: 44px; }
.consent { position: absolute; left: 0; width: 680px; height: 40px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 20px; color: var(--l-text2); white-space: nowrap; }
.consent .radio { width: 24px; height: 24px; border-radius: 9px; box-shadow: inset 0 0 0 2px var(--l-text2); background: var(--l-control); display: grid; place-items: center; }
.consent .radio.on { background: var(--l-btn); box-shadow: none; color: var(--l-btn-text); }
.consent .radio svg { width: 16px; height: 16px; }
.consent u { color: var(--l-link); }

/* QR（桌面面板内） */
.lp-qr { left: 210px; top: 120px; width: 260px; height: 260px; border-radius: 24px; background: #fff; box-shadow: inset 0 0 0 1px var(--l-control-border); padding: 16px; }
.lp-qr svg { width: 100%; height: 100%; display: block; }
.lp-qr .cover { position: absolute; inset: 0; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(253,253,248,.94); color: rgba(0,0,0,.88); font-size: 20px; font-weight: 700; }
.lp-qr .cover .okc { width: 64px; height: 64px; border-radius: 50%; background: #3C3F43; color: #fff; display: grid; place-items: center; }
.lp-qr .cover .okc svg { width: 36px; height: 36px; }
.lp-qr .cover button { height: 56px; padding: 0 28px; border-radius: 40px; background: #3C3F43; color: #FCFCFC; font-size: 20px; font-weight: 700; }
.lp-status { left: 0; top: 386px; width: 680px; height: 40px; text-align: center; font-size: 20px; line-height: 40px; color: var(--l-text2); }
.lp-status.strong { color: var(--l-title); font-weight: 600; }
.lp-hint { left: 0; top: 430px; width: 680px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: var(--l-text2); }

/* 协议弹窗（设计单位） */
.dlg-scrim { position: absolute; inset: 0; background: var(--l-scrim); display: flex; align-items: center; justify-content: center; z-index: 20; }
.dlg { width: 600px; background: var(--l-panel); border-radius: 36px; box-shadow: inset 0 0 0 1px var(--l-panel-border); padding: 40px 40px 36px; text-align: center; }
.dlg h4 { margin: 0 0 16px; font-size: 30px; font-weight: 700; color: var(--l-title); }
.dlg p { margin: 0 0 32px; font-size: 22px; line-height: 32px; color: var(--l-text2); }
.dlg p u { color: var(--l-link); }
.dlg .btns { display: flex; gap: 20px; justify-content: center; }
.dlg .btns button { width: 250px; height: 80px; border-radius: 40px; font-size: 24px; font-weight: 700; }
.dlg .btns .no { background: var(--l-control); box-shadow: inset 0 0 0 1px var(--l-control-border); color: var(--l-title); }
.dlg .btns .yes { background: var(--l-btn); color: var(--l-btn-text); }

/* 新增 / 调整 标注 */
.is-new, .is-tune { outline: 4px dashed var(--mark); outline-offset: 6px; }
.is-tune { outline-color: var(--tune); }
.flag { position: absolute; z-index: 3; top: -18px; right: -14px; height: 30px; padding: 0 10px; border-radius: 15px; background: var(--mark); color: #fff; font-size: 17px; font-weight: 700; line-height: 30px; pointer-events: none; white-space: nowrap; }
.is-tune > .flag { background: var(--tune); }
body.marks-off .is-new, body.marks-off .is-tune { outline: none; }
body.marks-off .flag, body.marks-off .flag-css { display: none; }

/* ── 相机 / 首页 / 弹层（CSS px） ── */
.cam { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 40%, #3a3d42 0%, #17181a 60%, #0b0b0c 100%); color: #fff; }
.cam .scene { position: absolute; left: 50%; top: 178px; width: 300px; height: 196px; margin-left: -150px; border-radius: 10px; background: linear-gradient(160deg,#e9e9e4,#cfcfca); transform: perspective(600px) rotateX(8deg) rotateZ(-4deg); filter: blur(.4px); box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.cam .scene .qr { position: absolute; left: 50%; top: 30px; width: 110px; height: 110px; margin-left: -55px; background: #fff; padding: 7px; border-radius: 6px; }
.cam .scene .qr svg { width: 100%; height: 100%; display: block; }
.cam .scene .cap { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: rgba(0,0,0,.6); font-size: 10px; }
.cam .finder { position: absolute; left: 50%; top: 160px; width: 236px; height: 236px; margin-left: -118px; }
.cam .finder i { position: absolute; width: 34px; height: 34px; border: 4px solid #fff; }
.cam .finder i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
.cam .finder i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
.cam .finder i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
.cam .finder i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
.cam .finder .line { position: absolute; left: 12px; right: 12px; top: 10%; height: 2px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: scan 2.2s ease-in-out infinite; }
@keyframes scan { 0% { top: 8%; } 50% { top: 90%; } 100% { top: 8%; } }
@media (prefers-reduced-motion: reduce) { .ring, .cam .finder .line { animation: none; } }
.cam .bar { position: absolute; top: 54px; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; }
.cam .bar button { position: absolute; left: 16px; top: 0; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.14); display: grid; place-items: center; color: #fff; }
.cam .bar button svg { width: 20px; height: 20px; }
.cam .tip { position: absolute; left: 24px; right: 24px; top: 426px; text-align: center; }
.cam .tip b { display: block; font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.cam .tip span { font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.66); }
.cam .torch { position: absolute; left: 50%; top: 560px; width: 56px; height: 56px; margin-left: -28px; border-radius: 28px; background: rgba(255,255,255,.14); display: grid; place-items: center; }
.cam .torch svg { width: 24px; height: 24px; }
.cam .sim { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); height: 40px; padding: 0 18px; border-radius: 20px; font-size: 14px; color: #fff; background: rgba(47,107,255,.85); white-space: nowrap; }

.home { position: absolute; inset: 0; background: var(--a-bg); color: var(--a-text); }
.home .hdr { position: absolute; top: 56px; left: 20px; right: 16px; height: 44px; display: flex; align-items: center; justify-content: space-between; }
.home .hdr h2 { margin: 0; font-size: 28px; font-weight: 700; }
.home .hdr .acts { display: flex; gap: 10px; align-items: center; }
.home .ibtn { position: relative; width: 40px; height: 40px; border-radius: 20px; background: var(--a-chip); box-shadow: inset 0 0 0 1px var(--a-line); display: grid; place-items: center; color: var(--a-text); }

  let cells = '';

  const inFinder = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if (inFinder(x, y)) continue; if (rnd() > 0.52) cells += `<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`; }

  row: (top, o) => `<button class="lp-row${mark(o.kind)}" style="top:${top}px" data-act="${o.act}"><span class="ic">${o.icon}</span><span class="t">${o.t}</span><span class="s">${o.s}</span><span class="chev">${IC.chev}</span>${flag(o.kind)}</button>`,
  err: t => `<div class="lp-err">${t}</div>`,
  ring: top => `<div class="lp-ring" style="top:${top}px"><div class="ring"></div></div>`,
  center: (top, html) => `<div class="lp-center" style="top:${top}px">${html}</div>`,
  skip: () => `<div class="lp-skip"><button data-act="noop">跳过登录</button></div>`,
};

/* ─────────────── 各屏的面板内容 ─────────────── */
function panelFor(dev) {
  const st = S[dev]; const id = ID(); const isD = dev === 'd'; const peer = RN(PEER(S.region)); const here = RN(S.region);
  const pill = isD && S.region === 'cn' ? 'CN' : '';
  const viaWord = st.via === 'email' ? id.word : `${PLABEL[st.via]} 账号`;
  switch (st.step) {
    case 'identifier': case 'consent':
      return P.title('登录 Cindy', pill)
        + P.input({ filled: st.input, value: id.shown, placeholder: id.ph, act: 'fill', prefix: id.prefix })
        + P.btn('继续', 'submitId', !st.input)
        + (isD ? P.skip() : '');
    case 'code':
      return P.back('goto:identifier') + P.title('输入验证码') + P.sub(`验证码已发送至 <strong>${esc(id.sentTo)}</strong>`)
        + P.input({ filled: st.code, value: '482 915', placeholder: '6 位验证码', act: 'fillCode', center: true })
        + P.link('58 秒后可重新发送', true)
        + P.btn('继续', 'verify', !st.code, 'tune', '调整：原为「登录」');
    case 'oauth':
      return (isD ? P.back('goto:identifier') : '') + P.title('请在浏览器中完成登录') + P.sub(`${PLABEL[st.via]} · 完成后会自动返回 Cindy。`)
        + P.ring(168) + P.center(262, '处理中…') + (isD ? '' : P.btn2('取消', 'goto:identifier'));
    case 'sso':
      return P.back('goto:identifier') + P.title('企业 SSO 登录') + P.sub('输入企业 ID、组织 slug 或已验证域名，跳转到企业单点登录。')
        + P.input({ filled: st.input, value: 'xd.com', placeholder: '企业 ID、slug 或域名', act: 'fill' })
        + P.link('不知道企业登录标识？请联系企业管理员。')
        + P.btn('继续', 'ssoGo', !st.input);
    case 'signup': {
      const who = st.via === 'email'
        ? `<strong>${esc(id.masked)}</strong> 还没有注册。`
        : `这个 ${PLABEL[st.via]} 账号还没有注册 Cindy。`;
      const hint = st.via === 'email'
        ? `之前用 ${S.region === 'cn' ? 'Apple 或微信' : 'Apple 或 Google '}登录过？请返回选择。`
        : `之前用${id.word}登录过？请返回用${id.word}登录。`;
      return P.back('goto:identifier') + P.title('还没有 Cindy 账号') + P.sub(who + hint)
        + P.row(158, { icon: IC.plus, t: '创建新账号', s: st.via === 'email' ? `用这个${id.word}注册 Cindy` : `用这个 ${PLABEL[st.via]} 账号注册`, act: 'create', kind: 'new' })
        + (isD
          ? P.row(278, { icon: IC.phone, t: '用手机扫码登录', s: '手机已登录？扫一扫直接进入', act: 'goto:qr', kind: 'new' })
          : P.row(278, { icon: IC.scan, t: '扫码登录', s: '电脑已登录？扫电脑上的二维码', act: 'goto:scan', kind: 'new' }));
    }
    case 'region': {
      const device = isD ? '这台电脑' : '这台手机';
      if (st.regionFrom === 'scan') {
        return P.back('goto:scan') + P.title(`电脑上是${peer} Cindy`) + P.sub(`两个版本的账号和数据不互通。切换后，${device}会连接${peer}服务，登录电脑上的账号。`)
          + P.row(158, { icon: IC.swap, t: `切换到${peer}并登录`, s: '登录电脑上的同一个账号', act: 'switchScan', kind: 'new' })
          + P.row(278, { icon: IC.back, t: '不切换', s: '返回，用其他方式登录', act: 'goto:identifier', kind: 'new' });
      }
      return P.back('goto:identifier') + P.title(`这个${viaWord.replace(' 账号', '')}在${peer}有账号`) + P.sub(`两个版本的账号和数据不互通。切换后，${device}会连接${peer}服务。`)
        + P.row(158, { icon: IC.swap, t: `切换到${peer}登录`, s: '原来的任务和设置都在那里', act: 'switch', kind: 'new' })
        + P.row(278, { icon: IC.plus, t: `在${here}新建账号`, s: '新账号里没有原来的数据', act: 'create', kind: 'new' });
    }
    case 'switching':
      return P.title(`正在切换到${peer}`) + P.sub(`正在连接${peer}服务并完成登录…`) + P.ring(180);
    case 'scanWait':
      return P.back('goto:scan') + P.title('等待电脑允许') + P.sub('请在电脑上点「允许」，手机会自动登录。') + P.ring(170)
        + P.center(290, '电脑超过 60 秒未操作，二维码会失效');
    case 'accounts':
      return P.title('选择身份') + P.sub('选择本次要进入的个人或组织身份。')
        + P.row(158, { icon: IC.user, t: '个人身份', s: id.masked, act: 'finish' })
        + P.row(278, { icon: IC.org, t: '心动网络', s: '组织身份', act: 'finish' });
    case 'binding': {
      const phone = S.region === 'cn';
      return P.title(phone ? '绑定手机号' : '绑定真实邮箱') + P.sub(phone ? '需要验证手机号后才能完成登录。' : '需要验证真实邮箱后才能完成登录。')
        + P.input({ filled: st.bindDone, value: phone ? '138 0013 8000' : 'user@example.com', placeholder: phone ? '输入手机号' : '输入邮箱地址', act: 'fillBind' })
        + P.btn('发送验证码', 'finish', !st.bindDone);
    }
    case 'qr': {
      const q = st.qr;
      let cover = '';
      if (q === 'scanned') cover = `<div class="cover"><div class="okc">${IC.check}</div>已扫码</div>`;
      if (q === 'expired') cover = `<div class="cover">二维码已过期<button data-act="qr:refresh">刷新</button></div>`;
      const status = q === 'scanned' ? '<div class="lp-status strong">请在手机上点「登录」</div>'
        : q === 'expired' ? '<div class="lp-status">二维码 2 分钟内有效</div>'
        : '<div class="lp-status">二维码 2 分钟内有效，过期自动刷新</div>';
      return P.back('goto:identifier') + P.title('用手机扫码登录', pill) + P.sub('打开 Cindy 手机 App，点首页右上角的「扫一扫」。')
        + `<div class="lp-qr">${qrSvg(3)}${cover}</div>` + status
        + '<div class="lp-hint">没装手机 App？用手机相机扫码即可下载</div>';
    }
    case 'qrRegion': {
      const phoneRegion = PEER(S.region);
      return P.back('goto:qr') + P.title(`手机上的账号属于${RN(phoneRegion)}`) + P.sub(`两个版本的账号和数据不互通。切换后，这台电脑会连接${RN(phoneRegion)}服务。`)
        + P.row(158, { icon: IC.swap, t: `切换到${RN(phoneRegion)}并登录`, s: '登录手机上的同一个账号', act: 'switch', kind: 'new' })
        + P.row(278, { icon: IC.back, t: '不切换', s: '返回，用其他方式登录', act: 'goto:identifier', kind: 'new' });
    }
    default: return '';
  }
}

/* ─────────────── 交互 ─────────────── */
function go(dev, step, extra = {}) { Object.assign(S[dev], { step, toast: '' }, extra); render(); }
function afterVerify(dev) {
  if (S.account === 'existing') go(dev, 'done', { toast: '登录成功' });
  else if (S.account === 'new') go(dev, 'signup');
  else go(dev, 'region', { regionFrom: 'verify' });
}
function needConsent(dev, then) {
  if (S[dev].consent) return then();
  S[dev].modal = true; S[dev].pending = then; render();
}
function act(dev, a) {
  const st = S[dev];
  if (a === 'noop') return;
  if (a.startsWith('goto:')) {
    const t = a.slice(5);
    if (t === 'qr') return go(dev, 'qr', { qr: 'waiting' });
    if (t === 'identifier') return go(dev, 'identifier', { via: 'email', modal: false });
    return go(dev, t);
  }
  if (a === 'fill') { st.input = true; return render(); }
  if (a === 'fillCode') { st.code = true; return render(); }
  if (a === 'fillBind') { st.bindDone = true; return render(); }
  if (a === 'toggleConsent') { st.consent = !st.consent; return render(); }
  if (a === 'consent:yes') { st.consent = true; st.modal = false; const p = st.pending; st.pending = null; return p ? p() : render(); }
  if (a === 'consent:no') { st.modal = false; st.pending = null; return render(); }
  if (a === 'submitId') return needConsent(dev, () => go(dev, 'code', { via: 'email', code: false }));
  if (a === 'verify') return afterVerify(dev);
  if (a.startsWith('oauth:')) {
    const p = a.slice(6);
    if (p === 'sso') return go(dev, 'sso', { input: false });
    return needConsent(dev, () => go(dev, 'oauth', { via: p }));
  }
  if (a === 'oauthDone') return afterVerify(dev);
  if (a === 'ssoGo') return go(dev, 'oauth', { via: 'sso' });
  if (a === 'create') return go(dev, 'done', { toast: '账号已创建，欢迎使用 Cindy' });
  if (a === 'switch' || a === 'switchScan') {
    const next = a === 'switchScan' ? 'scanWait' : 'switching';
    if (next === 'scanWait') return go(dev, 'scanWait');
    go(dev, 'switching');
    clearTimeout(act._t); act._t = setTimeout(() => { if (S[dev].step === 'switching') go(dev, 'done', { toast: `已切换到${RN(PEER(S.region))}并登录` }); }, 1600);
    return;
  }
  if (a === 'scanOk') { // 手机扫到电脑二维码
    if (S.account === 'other') return go('m', 'region', { regionFrom: 'scan' });
    return go('m', 'scanWait');
  }
  if (a === 'pcAllowed') return go('m', 'done', { toast: S.account === 'other' ? `已切换到${RN(PEER(S.region))}并登录` : '已登录电脑上的账号' });
  if (a === 'finish') return go(dev, 'done', { toast: '登录成功' });
  if (a === 'qr:scanned') { st.qr = 'scanned'; return render(); }
  if (a === 'qr:expire') { st.qr = 'expired'; return render(); }
  if (a === 'qr:refresh') { st.qr = 'waiting'; return render(); }
  if (a === 'qr:confirmed') {
    if (S.account === 'other') return go('d', 'qrRegion');
    return go('d', 'done', { toast: '已登录手机上的账号' });
  }
}

/* 双端配合 */
function xact(a) {
  const x = S.x;
  const mismatch = S.account === 'other';
  switch (a) {
    case 'reset': Object.assign(x, x.dir === 'pc' ? { pc: 'qr', qr: 'waiting', ph: 'home', phToast: '', pcToast: '' } : { pc: 'main', qr: 'waiting', ph: 'signup', phToast: '', pcToast: '' }); break;
    // 方向 pc：电脑出码，已登录手机扫
    case 'ph:openScan': x.ph = 'camera'; x.phToast = ''; break;
    case 'ph:closeScan': x.ph = 'home'; break;
    case 'ph:scanned': x.ph = 'sheet'; if (x.pc === 'qr') x.qr = 'scanned'; break;
    case 'ph:cancel': x.ph = 'home'; x.qr = 'waiting'; break;
    case 'ph:confirm': x.ph = 'home'; if (mismatch) { x.pc = 'qrRegion'; x.phToast = '请在电脑上确认切换版本'; } else { x.pc = 'done'; x.phToast = '电脑已登录'; } break;
    case 'pc:switch': x.pc = 'switching'; render(); clearTimeout(xact._t); xact._t = setTimeout(() => { if (S.x.pc === 'switching') { S.x.pc = 'done'; render(); } }, 1400); return;
    case 'pc:back': x.pc = 'qr'; x.qr = 'waiting'; break;
    case 'qr:expire': x.qr = 'expired'; break;
    case 'qr:refresh': x.qr = 'waiting'; break;
    // 方向 phone：电脑已登录出码，手机扫
    case 'pc:openPhone': x.pc = 'mainQr'; x.pcToast = ''; break;
    case 'pc:closeDlg': x.pc = 'main'; break;
    case 'ph:toScan': x.ph = 'camera2'; break;
    case 'ph:back': x.ph = 'signup'; break;
    case 'ph:scanned2': if (x.pc === 'main') x.pc = 'mainQr'; if (mismatch) { x.ph = 'region'; } else { x.ph = 'wait'; x.pc = 'mainConfirm'; } break;
    case 'ph:switch': x.ph = 'wait'; x.pc = 'mainConfirm'; break;
    case 'pc:allow': x.pc = 'main'; x.pcToast = 'iPhone 已登录'; x.ph = 'done'; break;
    case 'pc:deny': x.pc = 'main'; x.pcToast = '已拒绝'; x.ph = 'camera2'; x.phToast = '电脑已拒绝这次登录'; break;
  }
  render();
}

const $ = id => document.getElementById(id);
function seg(label, key, opts) {
  return `<div class="ctl"><span>${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v, t]) => `<button data-set="${key}=${v}" aria-pressed="${S[key] === v}">${t}</button>`).join('')}</div></div>`;
}
function renderControls() {

function renderSteps() {
  if (S.view === 'map') { $('steps').innerHTML = `<h3>说明</h3><div style="font-size:13px;line-height:1.6;color:var(--ink2);padding:0 4px">点任一节点可跳到手机端对应的屏。</div>`; return; }
  if (S.view === 'duo') {
    $('steps').innerHTML = `<h3>扫码方向</h3><div class="list">${[['pc', '手机扫码登录电脑', '新增'], ['phone', '手机扫电脑二维码登录', '新增']].map(([v, t, g]) => `<button data-dir="${v}" aria-current="${S.x.dir === v ? 'step' : 'false'}"><span>${t}</span>${tagHtml(g)}</button>`).join('')}</div>`;
    return;
  }
  const dev = S.view === 'mobile' ? 'm' : 'd';

}
function noteHtml(n) {
  if (!n) return '';

    <div class="sec"><p>${n.what}</p></div>
    ${n.items && n.items.length ? `<div class="sec"><b>要点</b><ul>${n.items.map(i => `<li>${i}</li>`).join('')}</ul></div>` : ''}
    ${n.why ? `<div class="sec"><b>为什么这样设计</b><p>${n.why}</p></div>` : ''}
    ${n.server ? `<div class="sec"><b>需要服务端配合</b><p>${n.server}</p></div>` : ''}
    ${n.open && n.open.length ? `<div class="sec"><b>待确认</b><ul>${n.open.map(i => `<li>${i}</li>`).join('')}</ul></div>` : ''}`;
}
function renderNotes() {
  if (S.view === 'map') { $('notes').innerHTML = noteHtml({ tag: '新增', title: '改动范围', what: '手机端新增 5 个屏（创建账号提示、扫电脑二维码、等待电脑允许、版本不一致、切换中），调整 1 个（验证码按钮）。登录页本身不变。', items: ['电脑端新增手机扫码登录，并在登录页常驻入口。', '服务端：验证后不再自动注册；新增扫码登录票据；跨版本查询（可选）。'], open: ['版本切换需要先修改产品规则 §2.4，并确认跨境传输与商店合规。'] }); return; }

function fit(node, natW, natH, maxW) {
  const k = Math.min(1, maxW / natW);
  return `<div class="stagewrap" style="width:${natW * k}px;height:${natH * k}px"><div class="scaled" style="width:${natW}px;height:${natH}px;transform:scale(${k})">${node}</div></div>`;
}
function demoBar(items) {

function renderMobile() {

  if (st.step === 'scan') { inner = cameraScreen({ close: 'goto:signup', ok: 'scanOk' }, { t: '扫描电脑上 Cindy 显示的二维码', s: '电脑上：侧栏头像旁的手机图标 →「远程控制 Cindy」' }); dark = true; }
  else if (st.step === 'done') inner = homeScreen({ toast: st.toast });
  else inner = mobileLogin();
  const demos = [];

function renderDesktop() {

        <div class="col"><div class="head">第三方</div>${n(mProviders().filter(p => p !== 'sso').map(p => PLABEL[p]).join(' / '), 'iOS 上为系统原生授权；Android 国际版的 Apple 走浏览器', '', 'oauth')}${a('授权返回')}${n('身份已验证', '')}</div>
        <div class="col"><div class="head">企业 SSO（管理员开通，不走注册）</div>${n('企业 SSO 登录', '企业 ID / slug / 域名', '', 'sso')}${a()}${n('浏览器单点登录', '')}${a('首次')}${n('验证企业联系方式', '')}</div>
      </div></section>

function render() {
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle('marks-off', !S.marks);
  document.querySelector('.workspace').classList.toggle('wide', S.view === 'duo' || S.view === 'map');
  renderControls(); renderSteps(); renderNotes();
  if (S.view === 'mobile') renderMobile();
  else if (S.view === 'desktop') renderDesktop();
  else if (S.view === 'duo') renderDuo();
  else renderMap();
  writeHash();
}

/* 事件 */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-set],[data-act],[data-xact],[data-jump],[data-dir],[data-reset]');
  if (!t || t.disabled) return;
  if (t.dataset.set) {
    const [k, v] = t.dataset.set.split('=');
    if (k === 'marks') S.marks = v === '1'; else S[k] = v;
    if (k === 'region' || k === 'account') { resetFlows(); }
    return render();
  }
  if (t.dataset.reset) { resetFlows(); return render(); }
  if (t.dataset.dir) { S.x.dir = t.dataset.dir; xact('reset'); return; }
  if (t.dataset.jump) {
    const [dev, step] = t.dataset.jump.split(':');
    if (S.view === 'map') S.view = 'mobile';
    const st = S[dev];
    if (step === 'consent') { Object.assign(st, { step: 'identifier', modal: true, input: true, consent: false }); return render(); }
    const pre = { modal: false, toast: '' };
    if (step === 'code') Object.assign(pre, { input: true, code: false });
    if (step === 'region') pre.regionFrom = 'verify';
    if (step === 'oauth') pre.via = S.region === 'cn' ? 'wechat' : 'google';
    if (step === 'signup') pre.via = 'email';
    if (step === 'qr') pre.qr = 'waiting';
    if (step === 'done') pre.toast = '登录成功';
    if (step === 'sso') pre.input = false;
    Object.assign(st, pre, { step });
    return render();
  }
  if (t.dataset.xact) return xact(t.dataset.xact);
  const a = t.dataset.act;
  if (a.startsWith('x:')) return xact(a.slice(2));
  const dev = S.view === 'desktop' ? 'd' : 'm';
  act(dev, a);
});
function resetFlows() {
  Object.assign(S.m, { step: 'identifier', input: false, code: false, via: 'email', modal: false, toast: '', bindDone: false });
  Object.assign(S.d, { step: 'identifier', input: false, code: false, via: 'email', modal: false, toast: '', qr: 'waiting' });
  xact.__silent = true; Object.assign(S.x, S.x.dir === 'pc' ? { pc: 'qr', qr: 'waiting', ph: 'home', phToast: '', pcToast: '' } : { pc: 'main', ph: 'signup', phToast: '', pcToast: '' });
}

/* 深链：#view=mobile&step=signup&region=global&account=new&theme=dark&dir=pc&qr=scanned */
function writeHash() {
  const dev = S.view === 'desktop' ? 'd' : 'm';
  const p = new URLSearchParams({ view: S.view, region: S.region, account: S.account, theme: S.theme });
  if (S.view === 'mobile' || S.view === 'desktop') p.set('step', S[dev].modal ? 'consent' : S[dev].step);
  if (S.view === 'duo') p.set('dir', S.x.dir);
  history.replaceState(null, '', '#' + p.toString());
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of ['view', 'region', 'account', 'theme']) if (p.get(k)) S[k] = p.get(k);
  if (p.get('marks') === '0') S.marks = false;
  if (p.get('dir')) S.x.dir = p.get('dir');
  resetFlows();
  const step = p.get('step');
  if (step && (S.view === 'mobile' || S.view === 'desktop')) {
    const dev = S.view === 'desktop' ? 'd' : 'm'; const st = S[dev];
    if (step === 'consent') Object.assign(st, { step: 'identifier', modal: true, input: true });
    else Object.assign(st, { step, input: true, code: step !== 'code', via: p.get('via') || (step === 'oauth' ? (S.region === 'cn' ? 'wechat' : 'google') : 'email'), regionFrom: p.get('from') || 'verify', qr: p.get('qr') || 'waiting', toast: step === 'done' ? '登录成功' : '' });
  }
  if (S.view === 'duo') {
    const seq = (p.get('seq') || '').split(',').filter(Boolean);
    seq.forEach(s => xact(s));
  }
  // 深链回放：#view=mobile&do=fill,submitId,consent:yes,fillCode,verify
  if (S.view === 'mobile' || S.view === 'desktop') {
    (p.get('do') || '').split(',').filter(Boolean).forEach(a => act(S.view === 'desktop' ? 'd' : 'm', a));
  }
}
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
readHash(); render();
})();
