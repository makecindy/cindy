<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>远程连接 · 设计稿</title>
<style>
/* 视觉语言对齐 Cindy 菜单栏卡片：一句话说清状态，设备是有分量的实物，黑白为主、只有要你处理的东西才带颜色。
   拓扑按业内的画法：从这台电脑出发，从左到右，每台设备一条路线；经过的中转是路线上真实的一站，每一段都写着延迟
   （UniFi 的左右树 + 游戏加速器「本机 → 节点 → 服务器」的分段路线）。先只做电脑版。系统字体，不引外部字体。 */
:root {
  color-scheme: light;
  --bg: #f2f2f4; --card: #ffffff; --edge: rgba(0,0,0,.06);
  --ink: #1d1d1f; --ink-2: rgba(60,60,67,.6); --ink-3: rgba(60,60,67,.3); --sep: rgba(60,60,67,.12); --fill: rgba(120,120,128,.1);
  --trough: rgba(0,0,0,.045); --trough-edge: rgba(0,0,0,.07); --trough-in: inset 0 2px 4px rgba(0,0,0,.06);
  --bar: linear-gradient(180deg, #4a4a4e 0%, #2a2a2d 30%, #1d1d1f 100%); --bar-top: rgba(255,255,255,.35);
  --hub: radial-gradient(circle at 36% 24%, #58585c 0%, #2b2b2e 48%, #111113 100%); --hub-ink: #fff; --hub-halo: rgba(52,199,89,.18);
  --tile-shadow: 0 1px 2px rgba(0,0,0,.22), 0 8px 20px rgba(0,0,0,.18);
  --line: rgba(29,29,31,.22); --line-on: rgba(29,29,31,.5); --dot: #1d1d1f;
  --glass: rgba(255,255,255,.9); --glass-line: rgba(0,0,0,.06);
  --blue: #007aff; --orange: #ff9500; --red: #ff3b30; --green: #34c759;
  --pop-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 14px 36px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.06);
  --cta-bg: #1d1d1f; --cta-ink: #fff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000; --card: #141416; --edge: rgba(255,255,255,.09);
  --ink: #f5f5f7; --ink-2: rgba(235,235,245,.58); --ink-3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.5); --fill: rgba(120,120,128,.22);
  --trough: rgba(255,255,255,.05); --trough-edge: rgba(255,255,255,.12); --trough-in: inset 0 2px 6px rgba(0,0,0,.5);
  --bar: linear-gradient(180deg, #ffffff 0%, #f1f1f4 40%, #dcdce2 100%); --bar-top: rgba(255,255,255,1);
  --hub: radial-gradient(circle at 36% 24%, #ffffff 0%, #ececf0 46%, #c9c9d0 100%); --hub-ink: #111; --hub-halo: rgba(48,209,88,.2);
  --tile-shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.45), 0 0 22px rgba(255,255,255,.07);
  --line: rgba(245,245,247,.2); --line-on: rgba(245,245,247,.5); --dot: #fff;
  --glass: rgba(44,44,46,.86); --glass-line: rgba(255,255,255,.1);
  --blue: #0a84ff; --orange: #ff9f0a; --red: #ff453a; --green: #30d158;
  --pop-shadow: 0 0 0 .5px rgba(255,255,255,.1), 0 18px 48px rgba(0,0,0,.6);
  --cta-bg: #fff; --cta-ink: #111;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
svg.g { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 原型控制：不属于界面 */
.proto { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 80; display: flex; gap: 4px; align-items: center; padding: 4px; white-space: nowrap;
  border-radius: 999px; background: var(--glass); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); box-shadow: var(--pop-shadow); font-size: 12px; }
.proto select, .proto button { height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font-size: 12px; cursor: pointer; }
.proto select { appearance: none; background: var(--fill); padding-right: 28px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 12px, calc(100% - 11px) 12px; background-size: 4px 4px; background-repeat: no-repeat; }
.proto button:hover { background: var(--fill); }
.proto .tag { color: var(--ink-3); padding: 0 8px 0 10px; }

/* 一整张卡 */
.page { max-width: 1000px; margin: 0 auto; padding: 40px 24px 130px; }
.card { position: relative; background: var(--card); border-radius: 26px; box-shadow: 0 0 0 .5px var(--edge), 0 1px 2px rgba(0,0,0,.04), 0 24px 60px rgba(0,0,0,.08); padding: 22px 26px 22px; }
:root[data-theme="dark"] .card { box-shadow: 0 0 0 .5px var(--edge), inset 0 1px 0 rgba(255,255,255,.05), 0 30px 80px rgba(0,0,0,.6); }

.bar { display: flex; align-items: center; gap: 12px; min-height: 28px; }
.bar .brand { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; font-size: 15px; }
.bar .when { color: var(--ink-2); font-size: 13px; flex: 1; }
.bar .vlabel { font-size: 12px; color: var(--ink-2); }
.ib { width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.ib:hover { background: var(--fill); color: var(--ink); }
.ib svg { width: 17px; height: 17px; }
.toggle { position: relative; width: 38px; height: 23px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; background: var(--fill); flex-shrink: 0; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .25s cubic-bezier(.3,1.3,.5,1); }
.toggle[aria-checked="true"] { background: var(--green); }
.toggle[aria-checked="true"]::after { transform: translateX(15px); }

/* 顶上一行数字，不写句子：图本身已经在说话 */
.stats { margin-top: 14px; display: flex; gap: 18px; align-items: center; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.stats span { display: inline-flex; align-items: center; gap: 6px; }
.stats b { font-weight: 600; color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stats i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

/* 拓扑：这台电脑在中间，两边各一列路线（UniFi 的左右树 + 加速器的分段延迟，两侧都用上）。
   每台设备一行；经过的中转是路线上真实的一站，每一段线上写着这一段的延迟；一组设备多了就共用一条干线。 */
.stage { position: relative; margin: 18px -8px 0; }
.stage svg.links { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.nodes { position: absolute; inset: 0; }
.node { position: absolute; left: 0; top: 0; width: 0; height: 0; outline: none; }
.node.hub .disc { position: absolute; left: -28px; top: -28px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: var(--hub-ink); background: var(--hub); cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -6px 12px rgba(0,0,0,.1), 0 0 0 8px var(--hub-halo);
  transition: transform .35s cubic-bezier(.2,.9,.25,1.25); }
.node.hub .disc svg { width: 26px; height: 26px; stroke-width: 1.7; }
.node.hub:hover .disc, .node.hub:focus-visible .disc { transform: scale(1.04); }
.node.hub .cap { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; pointer-events: none; }
.node.hub .cap .n1 { font-size: 13px; font-weight: 600; }
.node.hub .cap .n2 { font-size: 11.5px; color: var(--ink-2); }
.hubring { position: absolute; left: -28px; top: -28px; width: 56px; height: 56px; border-radius: 50%; pointer-events: none; animation: breath 4.6s ease-in-out infinite; }
/* 一行 = 一台设备；R 在右边，L 在左边（名字写在远离中间的一侧） */
.row { position: absolute; left: 0; top: 0; width: 0; height: 0; cursor: pointer; outline: none; }
.row .tile { position: absolute; left: -18px; top: -18px; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--hub-ink); background: var(--bar);
  box-shadow: var(--tile-shadow), inset 0 1px 0 var(--bar-top); transition: transform .35s cubic-bezier(.2,.9,.25,1.25), background .4s, box-shadow .4s, color .4s; }
.row .tile svg { width: 19px; height: 19px; stroke-width: 1.9; }
.row:hover .tile, .row:focus-visible .tile { transform: translateY(-2px) scale(1.05); }
.row.active .tile::after { content: ""; position: absolute; inset: -5px; border-radius: 16px; border: 1.5px solid var(--dot); opacity: 0; animation: pulse 2.4s ease-out infinite; }
.row.low .tile { background: linear-gradient(180deg, #ffbe52, var(--orange)); color: #fff;
  box-shadow: var(--tile-shadow), inset 0 1px 0 rgba(255,255,255,.55), 0 0 14px 2px color-mix(in srgb, var(--orange) 55%, transparent), 0 0 36px 8px color-mix(in srgb, var(--orange) 22%, transparent); }
.row.low .tile::after { border-color: var(--orange); }
.row.off .tile, .row.fold .tile { background: var(--trough); color: var(--ink-3); box-shadow: var(--trough-in), 0 0 0 1px var(--trough-edge); }
.row.off .txt { opacity: .55; }
.row.sel .tile { box-shadow: var(--tile-shadow), inset 0 1px 0 var(--bar-top), 0 0 0 3px color-mix(in srgb, var(--blue) 55%, transparent); }
.row:focus-visible .tile { box-shadow: var(--tile-shadow), 0 0 0 3px var(--blue); }
.row .txt { position: absolute; top: -17px; white-space: nowrap; pointer-events: none; }
.row.R .txt { left: 30px; text-align: left; }
.row.L .txt { right: 30px; text-align: right; }
.row .n1 { font-size: 13.5px; font-weight: 600; line-height: 17px; }
.row .n2 { font-size: 12px; color: var(--ink-2); line-height: 16px; margin-top: 1px; }
.row .n2 b { font-weight: 600; color: var(--ink); }
.row.low .n2 b { color: var(--orange); }
.row.fold .n2 { color: var(--blue); }
.row.dim { opacity: .35; }
/* 颜色只用来说状态：绿 在线，橙 要处理，红 离线；蓝 是中转这种基础设施。其余照旧黑白。 */
.row .st { position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px var(--card), 0 0 8px color-mix(in srgb, var(--green) 75%, transparent); }
.row.low .st { background: var(--orange); box-shadow: 0 0 0 2px var(--card), 0 0 8px color-mix(in srgb, var(--orange) 75%, transparent); }
.row.off .st, .row.fold .st { background: var(--red); box-shadow: 0 0 0 2px var(--card), 0 0 8px color-mix(in srgb, var(--red) 65%, transparent); }
.row.off .n2 { color: color-mix(in srgb, var(--red) 70%, var(--ink-2)); }
.row.fold .n2 { color: var(--blue); }
.relay .tile { color: var(--blue); }
.peer .mini.r { color: var(--blue); }
/* 线框：不要实心块，机器图标和它的框都是线，线的颜色就是状态（绿 在线 / 橙 要处理 / 红 离线 / 蓝 中转）。 */
.st-line .row .st { display: none; }
.st-line .row .tile { --c: var(--green); background: color-mix(in srgb, var(--c) 6%, transparent); color: color-mix(in srgb, var(--c) 78%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 55%, transparent), 0 0 12px color-mix(in srgb, var(--c) 14%, transparent); }
.st-line .row .tile svg { stroke-width: 1.7; }
.st-line .row.low .tile { --c: var(--orange); }
.st-line .row.off .tile, .st-line .row.fold .tile { --c: var(--red); background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 45%, transparent); color: color-mix(in srgb, var(--c) 65%, transparent); }
.st-line .row.sel .tile { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 55%, transparent), 0 0 0 3px color-mix(in srgb, var(--blue) 55%, transparent); }
.st-line .row:hover .tile { color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c), 0 0 14px color-mix(in srgb, var(--c) 28%, transparent); }
.st-line .row.active .tile::after { border-color: var(--c); }
.st-line .relay .tile { background: color-mix(in srgb, var(--blue) 6%, transparent); color: color-mix(in srgb, var(--blue) 80%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--blue) 55%, transparent), 0 0 12px color-mix(in srgb, var(--blue) 14%, transparent); backdrop-filter: none; -webkit-backdrop-filter: none; }
.st-line .peer .mini { background: color-mix(in srgb, var(--green) 6%, transparent); color: color-mix(in srgb, var(--green) 78%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--green) 55%, transparent); }
.st-line .peer .mini.r { background: color-mix(in srgb, var(--blue) 6%, transparent); color: color-mix(in srgb, var(--blue) 80%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--blue) 55%, transparent); }
/* 状态的另外两种画法（原型里切换）：图标换色 / 整块换色 */
.st-icon .row .st, .st-tile .row .st { display: none; }
.st-icon .row .tile { color: var(--green); }
.st-icon .row.low .tile { background: var(--bar); color: var(--orange); box-shadow: var(--tile-shadow), inset 0 1px 0 var(--bar-top); }
.st-icon .row.off .tile, .st-icon .row.fold .tile { background: var(--trough); color: var(--red); box-shadow: var(--trough-in), 0 0 0 1px var(--trough-edge); }
.st-tile .row .tile { background: linear-gradient(180deg, #5ee08a 0%, #34c759 55%, #28a745 100%); color: #fff;
  box-shadow: var(--tile-shadow), inset 0 1px 0 rgba(255,255,255,.5), 0 0 14px 2px color-mix(in srgb, var(--green) 35%, transparent); }
.st-tile .row.off .tile, .st-tile .row.fold .tile { background: color-mix(in srgb, var(--red) 18%, var(--trough)); color: color-mix(in srgb, var(--red) 75%, var(--ink-3)); box-shadow: var(--trough-in), 0 0 0 1px color-mix(in srgb, var(--red) 35%, transparent); }
.st-tile .row.active .tile::after { border-color: var(--green); }
.elabel.fast .chip { color: var(--green); }
.elabel.slow .chip { color: var(--orange); }
/* 中转：路线上真实的一站 */
.relay { position: absolute; left: 0; top: 0; width: 0; height: 0; cursor: pointer; outline: none; }
.relay .tile { position: absolute; left: -18px; top: -18px; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--ink);
  background: var(--glass); backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
  box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 6px 16px rgba(0,0,0,.14), inset 0 0 0 .5px var(--glass-line), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .3s cubic-bezier(.2,.9,.25,1.25); }
.relay .tile svg { width: 19px; height: 19px; }
.relay:hover .tile { transform: scale(1.06); }
.relay .cap { position: absolute; bottom: 23px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11.5px; color: var(--ink-2); text-align: center; pointer-events: none; }
.relay .cap b { color: var(--ink); font-weight: 600; }
/* 线上的延迟 */
.labels { position: absolute; inset: 0; pointer-events: none; }
.elabel { position: absolute; left: 0; top: 0; }
.elabel .chip { position: absolute; transform: translate(-50%, -50%); height: 19px; padding: 0 7px; border-radius: 999px; white-space: nowrap; display: flex; align-items: center;
  background: var(--card); box-shadow: 0 0 0 .5px var(--glass-line), 0 2px 8px rgba(0,0,0,.08); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.elabel.low .chip { color: var(--orange); }
/* 分组名：设备多的时候，每条干线上方写一行 */
.gcap { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.gcap span { position: absolute; top: -17px; font-size: 11.5px; line-height: 14px; color: var(--ink-2); white-space: nowrap; }
.gcap.R span { left: 8px; }
.gcap.L span { right: 8px; }
.gcap i { font-style: normal; color: var(--ink-3); }
/* 设备之间 */
.peers { margin: 10px 0 0; }
.peers .h { font-size: 12px; color: var(--ink-2); margin: 0 0 6px; letter-spacing: .02em; }
.peer { display: flex; align-items: center; gap: 10px; height: 44px; }
.peer .mini { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--hub-ink); background: var(--bar); box-shadow: var(--tile-shadow), inset 0 1px 0 var(--bar-top); flex-shrink: 0; }
.peer .mini svg { width: 14px; height: 14px; stroke-width: 2; }
.peer .mini.r { background: var(--glass); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 4px 12px rgba(0,0,0,.12), inset 0 0 0 .5px var(--glass-line); }
.peer .seg { position: relative; width: 74px; height: 2px; background: var(--line-on); border-radius: 2px; flex-shrink: 0; }
.peer .seg.dash { background: repeating-linear-gradient(90deg, var(--line-on) 0 6px, transparent 6px 11px); }
.peer .seg .chip { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 18px; padding: 0 7px; border-radius: 999px; background: var(--card); font-size: 11px; font-weight: 600; white-space: nowrap; box-shadow: 0 0 0 .5px var(--glass-line); }
.peer .t { margin-left: 8px; font-size: 13px; }
.peer .t b { font-weight: 600; }
.peer .t span { color: var(--ink-2); }

/* 下半张：标签页 + 30 天 */
.tabs { display: flex; gap: 22px; margin-top: 16px; border-bottom: .5px solid var(--sep); }
.tabs button { position: relative; background: none; border: 0; padding: 8px 0 10px; font-size: 14px; color: var(--ink-2); cursor: pointer; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }
.tabs button b { font-weight: 600; color: var(--orange); margin-left: 3px; }
.panel { padding: 8px 2px 4px; min-height: 68px; }
.panel .ttl { display: flex; align-items: baseline; justify-content: space-between; font-size: 15px; font-weight: 600; }
.panel .ttl .r { font-size: 14px; font-weight: 400; color: var(--ink-2); }
.panel .empty { color: var(--ink-2); margin-top: 8px; font-size: 14px; }
.item2 { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.item2 i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-3)); flex-shrink: 0; }
.item2 .l { flex: 1; min-width: 0; }
.item2 .l b { font-weight: 600; }
.item2 .l span { color: var(--ink-2); }
.item2 .act { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 500; cursor: pointer; white-space: nowrap; }
.bigs { display: flex; gap: 28px; margin-top: 10px; }
.bigs .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.bigs .v small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.bigs .k { font-size: 12px; color: var(--ink-2); }
.month { margin-top: 10px; border-radius: 18px; background: var(--fill); padding: 14px 18px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; }
.month .k { font-size: 13px; color: var(--ink-2); }
.month .v { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin-top: 4px; }
.month svg { width: 100%; height: 56px; display: block; }
.month .x { background: none; border: 0; padding: 0; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.month .x svg { width: 12px; height: 12px; }
.bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
.cta { height: 40px; padding: 0 18px 0 14px; border-radius: 999px; border: 0; background: var(--cta-bg); color: var(--cta-ink); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 6px 16px rgba(0,0,0,.14); }
.cta:active { transform: scale(.97); }
.cta svg { width: 16px; height: 16px; stroke-width: 2.4; }
.cta kbd { font-family: inherit; font-weight: 500; opacity: .55; margin-left: 2px; }
.foot { margin-top: 22px; text-align: center; font-size: 13px; color: var(--ink-2); }

  pop.style.setProperty('--ox', (right ? 0 : w) + 'px'); pop.style.setProperty('--oy', (anchor.y - y) + 'px');
}
const header = (g, title, sub, editable) => `<div class="ph"><span class="ptile">${glyph(g)}</span>
  <div style="flex:1;min-width:0">${editable ? `<input data-name value="${title}" aria-label="设备名字">` : `<div style="font-size:17px;font-weight:600">${title}</div>`}<div class="s">${sub}</div></div>
  <button class="x" type="button" data-close aria-label="关闭">✕</button></div>`;
const row = (l, r, extra = '') => `<div class="item"><span class="l">${l}</span><span class="r ${extra}">${r}</span></div>`;
const sw = (l, on) => `<div class="item"><span class="l">${l}</span><button class="toggle sm" role="switch" aria-checked="${on}" aria-label="${l}"></button></div>`;
function devicePop(id) {
  const d = dev(id), P = PATHS[d.path], on = isOn(d), R = P.relay ? RELAYS[P.relay] : null;
  return `${header(d.glyph, d.name, on ? d.model : `${d.model} · ${d.seen}`, true)}
    ${d.path === 'v1' ? `<div class="banner">${glyph('warn')}<div><b>没有端到端加密。</b>这台还在用旧版 Cindy，更新以后自动换成新版连接。</div></div>` : ''}
    ${on ? `<div class="big"><div><div class="v num" data-p="down"></div><div class="k">接收</div></div><div><div class="v num" data-p="up"></div><div class="k">发送</div></div><div><div class="v num" data-p="ms"></div><div class="k">延迟</div></div></div>
      <svg class="area" data-p="area" viewBox="0 0 300 64" preserveAspectRatio="none" role="img" aria-label="最近 30 秒的接收速度"></svg>` : ''}
    <div class="group">${row('连接方式', on ? P.name : '离线')}${R ? row('路线', `<span class="num">这台电脑 → ${R.name}（${R.where}）${R.ms} ms → ${d.name} ${d.ms} ms</span>`) : ''}${on ? row('加密', d.path === 'v1' ? '<span style="color:var(--orange)">无</span>' : '端到端') : ''}
      ${on && d.path !== 'v1' ? row('安全码', '4821 0937 5512', 'mono') : ''}${d.task ? row('正在做', d.task) : ''}</div>${d.why ? `<div class="note">${d.why}</div>` : ''}
    ${on ? `<div class="acts">${d.glyph === 'phone' ? `<button class="act" type="button" data-act="file">${glyph('send')}发送文件</button>`
      : `<button class="act" type="button" data-act="desktop">${glyph('screen')}屏幕共享</button><button class="act" type="button" data-act="task">${glyph('plus')}新建任务</button><button class="act" type="button" data-act="file">${glyph('send')}发送文件</button>`}</div>` : ''}
    <div class="group">${sw('允许它控制这台电脑', true)}${sw('允许远程桌面', true)}${sw('允许用摄像头和麦克风', false)}</div>
    ${d.path === 'v1' ? '<button class="danger" type="button" data-act="remind" style="color:var(--blue)">提醒那台电脑更新</button>' : ''}
    <button class="danger" type="button" data-act="remove">移除此设备</button>`;
}
function hubPop() {
  return `${header('desktop', '这台电脑', 'Windows · 公司网络 · 新版连接')}
    <div class="group">${sw('允许别的设备控制', true)}${sw('允许远程桌面', true)}${sw('允许用摄像头和麦克风', false)}</div>
    <div class="group">${sw('没网也能连', true)}${sw('只允许加密连接', false)}</div>
    <div class="group"><div class="item" data-key="relay-official" style="cursor:pointer"><span class="l">Cindy 中转</span><span class="r num">18 ms</span><span class="chev">›</span></div>
      <div class="item" data-key="relay-mine" style="cursor:pointer"><span class="l">我的中转</span><span class="r num">25 ms</span><span class="chev">›</span></div></div>
    <div class="group">${row('跨网络直连', '多半经中转')}${row('IPv6', '没有')}${row('同一个网络', '1 台设备')}</div>
    <button class="danger" type="button" data-open="checkup" style="color:var(--blue)">网络体检</button>`;
}
function relayPop(r) {
  const R = RELAYS[r], users = Object.keys(DEVICES).map(dev).filter(d => PATHS[d.path].relay === r), mine = state.scenario === 'mine';
  return `${header('relay', R.name, `${R.where} · ${R.ms} ms · ${users.length ? '正在用' : '备用'}`)}
    <div class="seg2" role="group" aria-label="设备之间怎么连"><button type="button" data-route="auto" aria-pressed="${!mine}">自动</button><button type="button" data-route="mine" aria-pressed="${mine}">只用我的中转</button></div>
    <div class="s" style="font-size:13px;color:var(--ink-2);margin-top:8px">${mine ? '设备之间的数据只经过你自己的中转。' : '能直连就直连，连不上时走最快的中转。'}中转只转发，看不到内容。</div>
    <div class="group">${users.length ? users.map(u => row(u.name, `<span class="num">${R.ms + u.ms} ms · ↓ ${fmt(u.down)} MB/s</span>`)).join('') : row('现在没有设备经过它', '')}</div>
    <div class="group">${row('tap-fp.fpfp.cc', '<span class="num">25 ms</span>')}<div class="item"><span class="l" style="color:var(--blue)">添加我的中转…</span></div><div class="item"><span class="l" style="color:var(--blue)">让这台电脑当中转…</span></div></div>`;
}
function addPop() {
  return `${header('plus', '添加设备', '不用记任何密码或密钥')}
    <div class="group">${row('在新设备上用同一个账号登录 Cindy', '')}<div class="item"><span class="l" style="color:var(--ink-2);font-size:13px">它会自动出现在这里，连接方式也自动选好。</span></div></div>
    <div class="group">${row('没网时用配对码', '<span style="font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--ink)">382 615</span>')}<div class="item"><span class="l" style="color:var(--ink-2);font-size:13px">规划中 · 只能用一次，5 分钟后失效</span></div></div>`;
}
function checkPop() {
  const off = state.scenario === 'offline';
  return `${header('wave', '网络体检', off ? '外网断了，局域网照常' : '能用，跨网络时多半经中转')}
    <div class="group">${off ? row('外网', '<span style="color:var(--orange)">连不上</span>') + row('同一个网络', '1 台设备')
      : row('跨网络直连', '<span style="color:var(--orange)">公司网络较严格</span>') + row('UDP', '正常') + row('IPv6', '没有') + row('同一个网络', '1 台设备') + row('Cindy 中转', '<span class="num">18 ms</span>')}</div>
    <button class="danger" type="button" data-act="recheck" style="color:var(--blue)">重新检查</button>`;
}
function refreshPop() {
  const id = state.selected;
  if (!DEVICES[id] || !live[id]) return;
  const d = dev(id), P = PATHS[d.path], pop = $('pop'), c = P.low ? css('--orange') : css('--blue');
  const set = (k, v) => { const el = pop.querySelector(`[data-p="${k}"]`); if (el) el.innerHTML = v; };
  const total = (P.relay ? RELAYS[P.relay].ms : 0) + d.ms;
  set('down', `${fmt(d.down)}<small>MB/s</small>`); set('up', `${fmt(d.up)}<small>MB/s</small>`); set('ms', `${total}<small>ms</small>`);
  const area = pop.querySelector('[data-p="area"]');
  if (area) {
    const h = d.history, max = Math.max(...h, .05);
    const pts = h.map((v, k) => [(k / (h.length - 1)) * 300, 60 - (v / max) * 50]);
    const line = pts.map(([x, y], k) => `${k ? 'L' : 'M'} ${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
    area.innerHTML = `<defs><linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line} L 300 64 L 0 64 Z" fill="url(#af)"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  }
}

// ---------- 交互 ----------
let toastTimer;
function toast(text, c) {
  const t = $('toast');
  t.style.setProperty('--c', c ? `var(${c})` : 'var(--blue)');
  t.innerHTML = `<i></i>${text}`;
  t.classList.add('open');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('open'), 2800);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-key]');
  if (!t) { if (state.selected && !e.target.closest('#pop')) closePop(); return; }
  if (t.matches('.toggle')) { t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true')); if (t.id === 'v2') toast('已切回旧版，这里会显示旧版页面'); return; }
  if (t.dataset.close !== undefined) { closePop(); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; paintSummary(); return; }
  if (t.dataset.route) { setScenario(t.dataset.route === 'mine' ? 'mine' : 'daily'); openPop('relay-' + (t.dataset.route === 'mine' ? 'mine' : 'official')); return; }
  if (t.dataset.open) { openPop(t.dataset.open); return; }
  if (t.dataset.act) {
    const acts = { remind: '已在家里的 Mac mini 上提醒更新', desktop: '正在打开屏幕共享…', task: '在这台设备上新建任务…', file: '选择要发送的文件…', remove: '移除前会先请你确认',
      v1: '已切回旧版，这里会显示旧版页面', recheck: '检查完了', history: '过去 30 天的明细…', refresh: '已刷新' };
    toast(acts[t.dataset.act] || '…');
    return;
  }
  if (t.dataset.key === 'offgroup') { state.showOffline = true; layout(); tick(); return; }
  if (t.dataset.key) { state.selected === t.dataset.key ? closePop() : openPop(t.dataset.key); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.selected) closePop();
  const k = e.target.closest && e.target.closest('[data-key]');
  if (k && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); k.click(); }
});
function setScenario(s) {
  const was = state.scenario;
  state.scenario = s;
  $('scenario').value = s;
  layout();
  tick();
  if (was !== s) {
    const msg = { cellular: ['MacBook Pro 换成了直连 · 0.2 秒', '--blue'], offline: ['外网断了，同一个网络里的设备照常连着', '--orange'], mine: ['只用我的中转', '--blue'],
      bigfile: ['LiziXDMini 开始接收 3.2 GB', '--green'], daily: ['回到日常'] }[s];
    if (msg) toast(...msg);
  }
}
$('scenario').addEventListener('change', e => setScenario(e.target.value));
const setSt = m => { document.body.classList.remove('st-icon', 'st-tile', 'st-line'); if (m !== 'dot') document.body.classList.add('st-' + m); $('stmode').value = m; };
$('stmode').addEventListener('change', e => setSt(e.target.value));
$('theme').addEventListener('click', () => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = state.theme;
  $('theme').textContent = state.theme === 'light' ? '深色' : '浅色';
});
$('motion').addEventListener('click', () => { state.reduced = !state.reduced; document.body.classList.toggle('reduced', state.reduced); $('motion').textContent = state.reduced ? '恢复动效' : '减弱动效'; });
addEventListener('resize', () => { layout(); buildNodes(); paintNodes(); for (const k in pos) delete pos[k]; if (state.selected) placePop(state.selected); });

// 地址后面加 #dark、#still、#s=cellular、#tab=today、#open=mbp，直接打开对应的预览。
const hash = new URLSearchParams(location.hash.slice(1).replace(/,/g, '&'));
if (hash.has('dark') || (!hash.has('light') && matchMedia('(prefers-color-scheme: dark)').matches)) $('theme').click();
if (hash.has('still')) { state.reduced = true; document.body.classList.add('reduced'); $('motion').textContent = '恢复动效'; }
if (SCENARIOS[hash.get('s')]) state.scenario = hash.get('s');
if (['todo', 'recent', 'today'].includes(hash.get('tab'))) state.tab = hash.get('tab');
setSt(['icon', 'tile', 'dot'].includes(hash.get('st')) ? hash.get('st') : 'line');
$('scenario').value = state.scenario;
layout();
buildNodes();
tick();
setInterval(tick, 1000);
requestAnimationFrame(frame);
if (hash.get('open')) setTimeout(() => openPop(hash.get('open')), 120);
</script>
</body>
</html>
