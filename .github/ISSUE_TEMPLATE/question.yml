name: "Usage question / 使用问题"
description: "Ask a non-security usage question / 提一个与安全无关的使用问题"
title: "question: "
labels: [question]
body:
  - type: textarea
    id: goal
    attributes:
      label: "你想完成什么 / What are you trying to do"
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: "已尝试的步骤 / What you have tried"
  - type: textarea
    id: environment
    attributes:
      label: "环境 / Environment"
      value: |
        - Cindy 版本或 commit / version or commit:
        - 平台与版本 / platform & OS version:
