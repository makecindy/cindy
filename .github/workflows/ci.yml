name: codeql-scope-benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: codeql-scope-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    name: CodeQL scope (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: baseline
            config: ''
          - scope: scoped
            config: .github/codeql/codeql-config.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 49baccf63198224b6c7518f20375e71756f0dd7e
          lfs: true
      - name: Initialize CodeQL 2.27.3 with unchanged default queries
        uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: javascript-typescript
          build-mode: none
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-javascript-linux64.tar.zst
          config-file: ${{ matrix.config }}
          db-location: ${{ runner.temp }}/scope-db
      - name: Analyze without publishing alerts or databases
        uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          upload: never
          upload-database: false
          output: scope-evidence/sarif
      - name: Record database and extracted source inventory
        if: always()
        env:
          DATABASE_ROOT: ${{ runner.temp }}/scope-db
          SCOPE: ${{ matrix.scope }}
        run: |
          mkdir -p scope-evidence
          python3 - <<'PY'
          import os, pathlib, json, zipfile, subprocess
          root=pathlib.Path(os.environ['DATABASE_ROOT'])
          output=pathlib.Path('scope-evidence')
          sizes={}
          for db in root.iterdir():
              if not db.is_dir(): continue
              sizes[db.name]=sum(p.stat().st_size for p in db.rglob('*') if p.is_file())
              for archive in db.glob('src.zip'):
                  with zipfile.ZipFile(archive) as z:
                      (output/(db.name+'-sources.json')).write_text(json.dumps(sorted(z.namelist()),indent=2))
          metrics={'scope':os.environ['SCOPE'],'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'databaseBytes':sizes}
          (output/'metrics.json').write_text(json.dumps(metrics,indent=2))
          print(json.dumps(metrics,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codeql-scope-${{ matrix.scope }}
          path: scope-evidence/
          retention-days: 14
