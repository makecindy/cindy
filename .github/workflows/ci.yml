name: client-ci

on:
  pull_request:
  # merge queue 把 PR 与最新 main(及排在前面的 PR)合成临时分支,在上面重跑必需检查
  # (verify / Windows unit tests),全绿才合入。没有这个触发,队列会一直等到超时再把 PR 移出。
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# PR/merge_group 上新提交立即取消旧 run；push(main) 不取消在途 run，由 GitHub Actions
# 自动把排队中的多次合并折叠为最新一次，避免高频合并时反复拉起再杀掉整批 runner。
concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  XDT_SKIP_AGENT_BIN_INSTALL: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  ELECTRON_OVERRIDE_DIST_PATH: '${{ github.workspace }}/.electron-stub-dist'
  # 8192: desktop tsc 全量 typecheck 峰值内存随仓体增长已突破 4GB(2026-08-02 起
  # 所有 PR 的 verify 在 Typecheck desktop 步骤稳定 OOM,含纯 mobile 改动);
  # 公开仓 ubuntu-latest runner 内存 16GB,8GB heap 安全。
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  # 轻量前置变更分类（稀疏检出 + GitHub API，秒级返回）。所有事件类型保留稳定的
  # verify / Windows unit tests 汇总门禁；仅对明确无关的 job 组按路径跳过，
  # 未知范围、API 截断或分类失败均保守全跑或阻断。
  changes:
    name: Select CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verify_checks: ${{ steps.changes.outputs.verify_checks }}
      typecheck_desktop: ${{ steps.changes.outputs.typecheck_desktop }}
      typecheck_mobile: ${{ steps.changes.outputs.typecheck_mobile }}
      unit_desktop: ${{ steps.changes.outputs.unit_desktop }}
      unit_mobile: ${{ steps.changes.outputs.unit_mobile }}
      unit_packages: ${{ steps.changes.outputs.unit_packages }}
      windows_runner_checks: ${{ steps.changes.outputs.windows_runner_checks }}
      git_integration: ${{ steps.changes.outputs.git_integration }}
      host: ${{ steps.changes.outputs.host }}
    steps:
      - name: Checkout CI scripts and Host imports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            apps/host

      - name: Classify changed paths
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  # 静态检查和 runner 自测与类型检查、Linux 单测分片并行。这里不装
  # bundled ripgrep；它只在 Desktop 单测收集时需要，由单测分片自行安装。
  verify-checks:
    needs: changes
    if: needs.changes.outputs.verify_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check built-in Skill bundle versions
        env:
          SKILLS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD' }}
        run: node scripts/check-built-in-skills.mjs --base-ref "$SKILLS_BASE_REF"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify managed voice prompt compatibility
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
        run: |
          if ! git diff --quiet "$BASE_REF" HEAD -- packages/voice-input-core/src \
            ':(exclude)packages/voice-input-core/src/__tests__/**' \
            config/endpoint{,.global}.json scripts/check-voice-refinement-compat.mjs; then
            pnpm exec vite-node scripts/check-voice-refinement-compat.mjs
          fi

      # 纯文本扫描、秒级返回：逐用例重置模块、真实等待和普通单测读源码文本只允许
      # 比基线少（engineering-conventions.md §3.2 性能预算），在耗时步骤前快速失败。
      - name: Check unit test hygiene
        run: pnpm check:test-hygiene

      - name: Check settings search coverage
        env:
          SETTINGS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
        run: pnpm check:settings-search --base-ref "$SETTINGS_BASE_REF"

      # test:unit 的 runner 自测不能跟着 Vitest 分片重复执行；在检查 job 中跑一次，
      # Linux 单测分片只负责 workspace unit tier。
      - name: Run test runner self-tests
        run: pnpm test:runner

      # Cross-file security, permission, and design contracts are intentionally
      # outside the ordinary behavior-test pool, but remain a required gate.
      - name: Run Desktop and Mobile source-contract guards
        run: pnpm test:guard

      # No private service checkout or secrets: exercise production clients over real
      # loopback WebSockets with bounded fault injection. Failure blocks verify.
      - name: Run Device Link connection integration tests
        run: |
          pnpm --filter desktop exec tsc --project ../../scripts/device-link/tsconfig.json
          pnpm test:device-link

      # DS-7: candidate merge/head versus the event base; only mature colour
      # consumers block, and the same check also blocks off-scale corner radii
      # (DESIGN.md §5 Guard). Other geometry/adoption observations remain report-only.
      - name: Check added design colours
        env:
          DESIGN_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
          DESIGN_HEAD_REF: ${{ github.sha }}
        run: pnpm check:design-colors --base-ref "$DESIGN_BASE_REF" --head-ref "$DESIGN_HEAD_REF"

      - name: Check design inventory registration
        run: pnpm check:design-inventory

      - name: Check endpoint literals
        run: pnpm check:endpoints

      # i18n 三道静态门禁：key 结构一致性、品牌名收口、术语表一致性。
      # 都是纯文件扫描、秒级返回，放在耗时的单测之前快速失败。
      - name: Check i18n key consistency
        run: pnpm check:i18n

      - name: Check brand terminology
        run: pnpm check:brand-terminology

      - name: Check i18n glossary
        run: pnpm check:i18n-glossary

      - name: Validate SQLite migrations
        env:
          XDT_MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
        run: pnpm --filter desktop db:validate

      - name: Run scheduler architecture guard
        run: pnpm ci:scheduler-guard

      - name: Run mobile scope guard
        run: pnpm --filter mobile test:scope

  # Desktop main / renderer 与 Mobile 的类型检查拆为三个并行 job，避免串行拉长
  # 反馈时间；只装当前 Linux x64 依赖并复用主干的 pnpm 锁文件校验结果。
  typecheck-desktop-main:
    name: Typecheck (Desktop main)
    needs: changes
    if: needs.changes.outputs.typecheck_desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Select Linux x64 runner dependencies
        run: pnpm config set --location=project --json supportedArchitectures '{"os":["linux"],"cpu":["x64"],"libc":["glibc"]}'

      - name: Restore pnpm lockfile verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop (main)
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: '--max-old-space-size=10240'
        run: |
          node scripts/check-typecheck-shards.mjs
          pnpm exec tsc --noEmit -p tsconfig.main.json

  typecheck-desktop-renderer:
    name: Typecheck (Desktop renderer)
    needs: changes
    if: needs.changes.outputs.typecheck_desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Select Linux x64 runner dependencies
        run: pnpm config set --location=project --json supportedArchitectures '{"os":["linux"],"cpu":["x64"],"libc":["glibc"]}'

      - name: Restore pnpm lockfile verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop (renderer)
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: '--max-old-space-size=10240'
        run: |
          node scripts/check-typecheck-shards.mjs
          pnpm exec tsc --noEmit -p tsconfig.renderer.json

  typecheck-mobile:
    name: Typecheck (Mobile)
    needs: changes
    if: needs.changes.outputs.typecheck_mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Select Linux x64 runner dependencies
        run: pnpm config set --location=project --json supportedArchitectures '{"os":["linux"],"cpu":["x64"],"libc":["glibc"]}'

      - name: Restore pnpm lockfile verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile
        run: pnpm --filter mobile typecheck

  # Linux Desktop 单测使用与 Windows 相同的确定性按耗时 8 分片；Mobile 与轻量 packages
  # 拆到独立并行 job，避免压在 8 片关键路径上，也避免小包在 16 个分片里反复冷启动 Vitest。
  linux-unit-shards:
    name: Linux desktop unit tests (${{ matrix.shard }}/8)
    needs: changes
    if: needs.changes.outputs.unit_desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      XDT_UNIT_TEST_SHARD: ${{ matrix.shard }}/8

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Unit shards only read the working tree; only shard 1 runs localDb companion
        # regressions which load the LFS-tracked sqlite-vec extension.
        with:
          lfs: ${{ matrix.shard == 1 }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Select Linux x64 unit-test dependencies
        run: pnpm config set --location=project --json supportedArchitectures '{"os":["linux"],"cpu":["x64"],"libc":["glibc"]}'

      - name: Restore pnpm lockfile verification
        id: pnpm-verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: pnpm install --frozen-lockfile

      - name: Save verified lockfile from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.pnpm-verification.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: ${{ steps.pnpm-verification.outputs.cache-primary-key }}

      # XDT_SKIP_AGENT_BIN_INSTALL 跳过了 postinstall 的全部 agent 二进制,但
      # runtime-configs.ts 模块顶层的 bundledRipgrepDir() 缺 rg 时直接 throw,
      # 会让 apps/desktop 单测在收集阶段全挂——每个分片都必须单独装回来。
      # 缓存 bundled ripgrep：各分片都要装，GitHub Releases 偶发 504 时会整批变红。
      # 命中后 install:ripgrep 按 .version 标记直接跳过下载。
      - name: Cache bundled ripgrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ripgrep-bin
          key: ripgrep-bin-${{ runner.os }}-${{ hashFiles('tools/ripgrep/latest.json') }}

      - name: Install bundled ripgrep
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install:ripgrep

      - name: Install Linux user-installer test tools
        timeout-minutes: 5
        run: |
          # Keep Ubuntu's package signature checks and use official mirrors that
          # respond when mirrors.kernel.org stalls during TLS negotiation.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' \
              'https://security.ubuntu.com/ubuntu/' \
              'https://archive.ubuntu.com/ubuntu/' |
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes libarchive-tools binutils desktop-file-utils xdg-utils

      - name: Run Desktop unit test shard
        # package script 会传递 npm_execpath，让子进程复用当前 pnpm 入口。
        # XDT_VITEST_FILE_TIMINGS 让 Desktop 额外写出每个测试文件的耗时，供按耗时分片。
        env:
          XDT_VITEST_FILE_TIMINGS: ${{ runner.temp }}/vitest-file-timings/desktop-linux-shard-${{ matrix.shard }}.json
        run: pnpm run test:workspaces --tier unit --workspace desktop

      - name: Upload Desktop file timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-file-timings-linux-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-file-timings/
          if-no-files-found: ignore
          retention-days: 14

      # localDb suites are outside the unit tier; exercise these DB boundaries on both OSes.
      - name: Run companion database regressions
        if: matrix.shard == 1
        run: pnpm --filter desktop exec vitest run src/main/localDb/ipc/__tests__/botCanonicalSession.test.ts src/main/localDb/ipc/__tests__/botRemoteResourceProvider.test.ts

  linux-mobile-unit:
    name: Linux mobile unit tests
    needs: changes
    if: needs.changes.outputs.unit_mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Select Linux x64 unit-test dependencies
        run: pnpm config set --location=project --json supportedArchitectures '{"os":["linux"],"cpu":["x64"],"libc":["glibc"]}'

      - name: Restore pnpm lockfile verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: pnpm install --frozen-lockfile

      - name: Run Mobile unit tests
        run: pnpm run test:workspaces --tier unit --workspace mobile

  linux-packages-unit:
    name: Linux package unit tests
    needs: changes
    if: needs.changes.outputs.unit_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Select Linux x64 unit-test dependencies
        run: pnpm config set --location=project --json supportedArchitectures '{"os":["linux"],"cpu":["x64"],"libc":["glibc"]}'

      - name: Restore pnpm lockfile verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: pnpm install --frozen-lockfile

      - name: Run package unit tests
        run: pnpm run test:workspaces --tier unit --exclude-workspace desktop,mobile

      # 真实进程与 Unix socket 覆盖独立执行一次，不混入日常 unit 或其他分片。
      - name: Run Pi manager integration tests
        run: pnpm run test:workspaces --tier integration --workspace @cindy/maker-pi-manager

  # Host's Node tests are outside the Vitest workspace tiers. Exercise its
  # actual loaders, HTTP authorization and worker processes on every desktop OS.
  # Credential tests use synthetic records; no login or system keychain access.
  host-regressions:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    name: Host regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Host regressions
        run: pnpm --filter @cindy/host test
      # Most acceptance scripts in apps/host/scripts need native engines or a browser and
      # are not run here. Load each one's imports without running it, so a shared desktop
      # module that starts importing Electron fails here rather than on the next manual run.
      # Module import graph is platform independent: running once on Linux saves ~5 min of
      # macOS + Windows runner time per PR without reducing coverage.
      - name: Load Host acceptance scripts (imports only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/host
        run: node scripts/check-e2e-imports.mjs
      # These three need no engine, browser, account or network.
      - name: Host acceptance - provider configuration
        working-directory: apps/host
        run: node --import tsx --import ./src/loaders/register-raw.mjs scripts/provider-config.e2e.mjs
      - name: Host acceptance - IPC route
        run: pnpm --filter @cindy/host test:ipc-route
      # Not on Windows: stopping the background Host is refused there (ECONNREFUSED in the
      # final stop), a recorded baseline gap (docs/host/personal-migration-release-table.md).
      - name: Host acceptance - lifecycle
        if: matrix.os != 'windows-latest'
        run: pnpm --filter @cindy/host test:lifecycle
      # Types are platform independent: once is enough. A shared desktop body that
      # gains a port wired only in the desktop assembly passes the desktop checks
      # and fails here instead of at runtime in the Host.
      - name: Typecheck Host
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @cindy/host typecheck

  # 保留原 required check 名 verify；各分组仅允许明确无关时跳过，分类失败或任一必需组失败均阻断。
  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - changes
      - verify-checks
      - typecheck-desktop-main
      - typecheck-desktop-renderer
      - typecheck-mobile
      - linux-unit-shards
      - linux-mobile-unit
      - linux-packages-unit
      - host-regressions
    runs-on: ubuntu-latest
    steps:
      - name: Require selected Linux checks, typechecks, unit suites and Host regressions
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_CHECKS_REQUIRED: ${{ needs.changes.outputs.verify_checks }}
          VERIFY_CHECKS_RESULT: ${{ needs.verify-checks.result }}
          TYPECHECK_DESKTOP_REQUIRED: ${{ needs.changes.outputs.typecheck_desktop }}
          TYPECHECK_DESKTOP_MAIN_RESULT: ${{ needs.typecheck-desktop-main.result }}
          TYPECHECK_DESKTOP_RENDERER_RESULT: ${{ needs.typecheck-desktop-renderer.result }}
          TYPECHECK_MOBILE_REQUIRED: ${{ needs.changes.outputs.typecheck_mobile }}
          TYPECHECK_MOBILE_RESULT: ${{ needs.typecheck-mobile.result }}
          UNIT_DESKTOP_REQUIRED: ${{ needs.changes.outputs.unit_desktop }}
          LINUX_UNIT_SHARDS_RESULT: ${{ needs.linux-unit-shards.result }}
          UNIT_MOBILE_REQUIRED: ${{ needs.changes.outputs.unit_mobile }}
          LINUX_MOBILE_UNIT_RESULT: ${{ needs.linux-mobile-unit.result }}
          UNIT_PACKAGES_REQUIRED: ${{ needs.changes.outputs.unit_packages }}
          LINUX_PACKAGES_UNIT_RESULT: ${{ needs.linux-packages-unit.result }}
          HOST_REQUIRED: ${{ needs.changes.outputs.host }}
          HOST_REGRESSIONS_RESULT: ${{ needs.host-regressions.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          check_gate() {
            case "$1:$2" in
              true:success|false:skipped) ;;
              *) echo "$3 did not pass (required=$1 result=$2)"; exit 1 ;;
            esac
          }
          check_gate "$VERIFY_CHECKS_REQUIRED" "$VERIFY_CHECKS_RESULT" "verify-checks"
          check_gate "$TYPECHECK_DESKTOP_REQUIRED" "$TYPECHECK_DESKTOP_MAIN_RESULT" "typecheck-desktop-main"
          check_gate "$TYPECHECK_DESKTOP_REQUIRED" "$TYPECHECK_DESKTOP_RENDERER_RESULT" "typecheck-desktop-renderer"
          check_gate "$TYPECHECK_MOBILE_REQUIRED" "$TYPECHECK_MOBILE_RESULT" "typecheck-mobile"
          check_gate "$UNIT_DESKTOP_REQUIRED" "$LINUX_UNIT_SHARDS_RESULT" "linux-unit-shards"
          check_gate "$UNIT_MOBILE_REQUIRED" "$LINUX_MOBILE_UNIT_RESULT" "linux-mobile-unit"
          check_gate "$UNIT_PACKAGES_REQUIRED" "$LINUX_PACKAGES_UNIT_RESULT" "linux-packages-unit"
          check_gate "$HOST_REQUIRED" "$HOST_REGRESSIONS_RESULT" "host-regressions"

  # Linux 全绿不能覆盖 path separator、盘符、大小写和文件系统能力差异。八个
  # Windows Desktop 分片并行运行，与独立的 Mobile/Packages job 组成完整 unit tier，
  # 不再让 Mobile 与小包压在每片 Desktop 的关键路径上。
  # 分片数与实测依据见 docs/dev-rules/desktop-unit-test-performance.md。
  windows-unit-shards:
    name: Windows desktop unit tests (${{ matrix.shard }}/8)
    needs: changes
    if: needs.changes.outputs.unit_desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      XDT_UNIT_TEST_SHARD: ${{ matrix.shard }}/8

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 托管 Windows runner 的工作区在 D 盘，TEMP 默认在 C 盘，而 C 盘 IO 明显更慢。
      # Desktop 单测有 700 多个文件创建临时目录(electron stub 的 userData 也在 TEMP
      # 下)，所以把 TEMP/TMP 放到工作区所在盘，只影响本 job 后续步骤。不能用
      # RUNNER_TEMP(D:\a\_temp)：路径写进 Markdown 链接后 `\_` 会被当成转义，回复附件
      # 测试因此找不到文件。目录名的每一段都不要以 ASCII 标点开头。
      - name: Keep temp files on the workspace drive
        shell: pwsh
        run: |
          $temp = Join-Path (Split-Path -Qualifier $env:GITHUB_WORKSPACE) 'cindy-tmp'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP: $env:TEMP -> $temp"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          # Keep runner-only stores separate from jobs installing the full
          # packaging matrix, or their cache hits still need those downloads.
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      # Only this x64 unit-test job needs the runner's native dependencies.
      # Set the checkout's config so later pnpm run commands keep the same
      # selection instead of automatically reinstalling the packaging matrix.
      - name: Select Windows x64 unit-test dependencies
        shell: pwsh
        run: pnpm.cmd config set --location=project --json supportedArchitectures '{\"os\":[\"win32\"],\"cpu\":[\"x64\"],\"libc\":[\"glibc\"]}'

      # setup-node restores the package store. pnpm keeps its lockfile verification
      # result separately and checks the lockfile and active policies on reuse.
      - name: Restore pnpm lockfile verification
        id: pnpm-verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        id: install
        env:
          PNPM_STORE_CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: ./scripts/ci-windows-install.ps1 -ReportPath (Join-Path $env:RUNNER_TEMP 'pnpm-install.json')

      - name: Upload slow or failed pnpm install diagnostics
        if: ${{ !cancelled() && steps.install.outputs.report == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-install-windows-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pnpm-install.json
          retention-days: 7

      - name: Save verified lockfile from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.pnpm-verification.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: ${{ steps.pnpm-verification.outputs.cache-primary-key }}

      # 缓存 bundled ripgrep：各分片都要装，GitHub Releases 偶发 504 时会整批变红。
      # 命中后 install:ripgrep 按 .version 标记直接跳过下载。
      - name: Cache bundled ripgrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ripgrep-bin
          key: ripgrep-bin-${{ runner.os }}-${{ hashFiles('tools/ripgrep/latest.json') }}

      - name: Install bundled ripgrep
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install:ripgrep

      - name: Run Desktop unit tests
        # 通过 package script 传递
        # npm_execpath，避免 Windows 子进程退回 PATH 上的 pnpm.cmd。
        # XDT_VITEST_FILE_TIMINGS 让 Desktop 额外写出每个测试文件的耗时，供按耗时分片。
        env:
          XDT_VITEST_FILE_TIMINGS: ${{ runner.temp }}/vitest-file-timings/desktop-windows-shard-${{ matrix.shard }}.json
        run: pnpm run test:workspaces --tier unit --workspace desktop

      - name: Upload Desktop file timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-file-timings-windows-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-file-timings/
          if-no-files-found: ignore
          retention-days: 14

  windows-mobile-unit:
    name: Windows mobile unit tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.unit_mobile == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      XDT_UNIT_TEST_SHARD: ${{ matrix.shard }}/2

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep temp files on the workspace drive
        shell: pwsh
        run: |
          $temp = Join-Path (Split-Path -Qualifier $env:GITHUB_WORKSPACE) 'cindy-tmp'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Select Windows x64 unit-test dependencies
        shell: pwsh
        run: pnpm.cmd config set --location=project --json supportedArchitectures '{\"os\":[\"win32\"],\"cpu\":[\"x64\"],\"libc\":[\"glibc\"]}'

      - name: Restore pnpm lockfile verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        env:
          PNPM_STORE_CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: ./scripts/ci-windows-install.ps1 -ReportPath (Join-Path $env:RUNNER_TEMP 'pnpm-install.json')

      - name: Run Mobile unit tests
        run: pnpm run test:workspaces --tier unit --workspace mobile

  windows-packages-unit:
    name: Windows package unit tests
    needs: changes
    if: needs.changes.outputs.unit_packages == 'true'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep temp files on the workspace drive
        shell: pwsh
        run: |
          $temp = Join-Path (Split-Path -Qualifier $env:GITHUB_WORKSPACE) 'cindy-tmp'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Select Windows x64 unit-test dependencies
        shell: pwsh
        run: pnpm.cmd config set --location=project --json supportedArchitectures '{\"os\":[\"win32\"],\"cpu\":[\"x64\"],\"libc\":[\"glibc\"]}'

      - name: Restore pnpm lockfile verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        env:
          PNPM_STORE_CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: ./scripts/ci-windows-install.ps1 -ReportPath (Join-Path $env:RUNNER_TEMP 'pnpm-install.json')

      - name: Run package unit tests
        run: pnpm run test:workspaces --tier unit --exclude-workspace desktop,mobile

  # Windows runner 自测和伴侣数据库回归各只需执行一次。单独并行运行，避免给
  # 某一个 unit 分片额外叠加约 4 分钟、拖长整条关键路径。
  windows-runner-checks:
    name: Windows runner and database checks
    needs: changes
    if: needs.changes.outputs.windows_runner_checks == 'true'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 缓存 bundled ripgrep：各分片都要装，GitHub Releases 偶发 504 时会整批变红。
      # 命中后 install:ripgrep 按 .version 标记直接跳过下载。
      - name: Cache bundled ripgrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ripgrep-bin
          key: ripgrep-bin-${{ runner.os }}-${{ hashFiles('tools/ripgrep/latest.json') }}

      - name: Install bundled ripgrep
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install:ripgrep

      # 保留 Windows 路径、进程与锁的自测覆盖。
      - name: Run Windows test runner self-tests
        run: pnpm test:runner

      - name: Check Windows Codex credential publication
        run: node --experimental-strip-types apps/desktop/scripts/check-windows-codex-auth-move.mjs

      # The two-round real-Git chain belongs to the Git integration tier. Keep
      # Windows coverage outside the unit pool, with one worker and the same timeout.
      - name: Run Desktop to Host Git snapshot chain
        run: pnpm --dir apps/desktop exec vitest run --project git-integration src/main/maker-host/__tests__/hostGitSnapshotChain.git-integration.test.ts --maxWorkers=1

      # localDb suites are outside the unit tier; exercise these DB boundaries on both OSes.
      - name: Run companion database regressions
        run: pnpm --filter desktop exec vitest run src/main/localDb/ipc/__tests__/botCanonicalSession.test.ts src/main/localDb/ipc/__tests__/botRemoteResourceProvider.test.ts

      # Reuse this supported runner and its native dependencies. Do not filter the
      # workflow itself: PRs, merge queue and main pushes must keep the stable gate.
      - name: Select database regressions
        id: database-changes
        run: node scripts/ci-database-tests.mjs detect

      # Includes real empty/old database upgrades and reopen/idempotency checks.
      # The runner rejects unsupported platforms and skipped migration replay.
      - name: Run database and migration regressions
        if: steps.database-changes.outputs.required == 'true'
        run: node scripts/ci-database-tests.mjs run

  # 保留稳定的必需检查名，并确保任一必需分片、子套件或一次性检查失败、取消都会阻断汇总门禁。
  windows-unit:
    name: Windows unit tests
    if: ${{ always() }}
    needs:
      - changes
      - windows-unit-shards
      - windows-mobile-unit
      - windows-packages-unit
      - windows-runner-checks
    runs-on: ubuntu-latest
    steps:
      - name: Require selected Windows unit suites and runner checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          UNIT_DESKTOP_REQUIRED: ${{ needs.changes.outputs.unit_desktop }}
          WINDOWS_UNIT_SHARDS_RESULT: ${{ needs.windows-unit-shards.result }}
          UNIT_MOBILE_REQUIRED: ${{ needs.changes.outputs.unit_mobile }}
          WINDOWS_MOBILE_UNIT_RESULT: ${{ needs.windows-mobile-unit.result }}
          UNIT_PACKAGES_REQUIRED: ${{ needs.changes.outputs.unit_packages }}
          WINDOWS_PACKAGES_UNIT_RESULT: ${{ needs.windows-packages-unit.result }}
          WINDOWS_RUNNER_CHECKS_REQUIRED: ${{ needs.changes.outputs.windows_runner_checks }}
          WINDOWS_RUNNER_CHECKS_RESULT: ${{ needs.windows-runner-checks.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          check_gate() {
            case "$1:$2" in
              true:success|false:skipped) ;;
              *) echo "$3 did not pass (required=$1 result=$2)"; exit 1 ;;
            esac
          }
          check_gate "$UNIT_DESKTOP_REQUIRED" "$WINDOWS_UNIT_SHARDS_RESULT" "windows-unit-shards"
          check_gate "$UNIT_MOBILE_REQUIRED" "$WINDOWS_MOBILE_UNIT_RESULT" "windows-mobile-unit"
          check_gate "$UNIT_PACKAGES_REQUIRED" "$WINDOWS_PACKAGES_UNIT_RESULT" "windows-packages-unit"
          check_gate "$WINDOWS_RUNNER_CHECKS_REQUIRED" "$WINDOWS_RUNNER_CHECKS_RESULT" "windows-runner-checks"

  git-integration:
    name: Desktop Git integration
    needs: changes
    if: needs.changes.outputs.git_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Select Linux x64 runner dependencies
        run: pnpm config set --location=project --json supportedArchitectures '{"os":["linux"],"cpu":["x64"],"libc":["glibc"]}'

      - name: Restore pnpm lockfile verification
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-cache/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc') }}

      - name: Install dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-cache
        run: pnpm install --frozen-lockfile

      # 缓存 bundled ripgrep：各分片都要装，GitHub Releases 偶发 504 时会整批变红。
      # 命中后 install:ripgrep 按 .version 标记直接跳过下载。
      - name: Cache bundled ripgrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ripgrep-bin
          key: ripgrep-bin-${{ runner.os }}-${{ hashFiles('tools/ripgrep/latest.json') }}

      - name: Install bundled ripgrep
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install:ripgrep

      # test:runner 已在 verify-checks 与 windows-runner-checks 各跑一遍，这里不再重复执行第三遍。
      - name: Run Desktop Git integration tests
        run: |
          node scripts/test-workspaces.mjs --tier git-integration
          node --test scripts/__tests__/dev-migration-policy.git-integration.test.ts
