name: vendor-update

# Daily: bring the Agent runtimes (Claude Code, Claude Agent SDK, Codex, Pi, ripgrep) to the newest
# upstream releases that are at least 24 hours old (mise's default minimum_release_age), run the
# smoke + maker-core integration gate on the real binaries, and open or refresh the
# chore/vendor-pins pull request. A failing gate leaves the pins alone and fails this run.
#
# PRs opened with the default GITHUB_TOKEN do not start client-ci and need the repository setting
# "Allow GitHub Actions to create and approve pull requests". Set the VENDOR_UPDATE_TOKEN secret
# (GitHub App or fine-grained token: contents + pull requests write) so the PR gets normal CI.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vendor-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'makecindy/cindy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.VENDOR_UPDATE_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          XDT_SKIP_AGENT_BIN_INSTALL: '1'

      - name: Update runtimes, run the gate, open the pin PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/vendor-update.mjs --open-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.VENDOR_UPDATE_TOKEN || github.token }}
