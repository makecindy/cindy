name: pr-template-rules

on:
  pull_request:
    paths:
      - 'scripts/check-pr-template-rules.mjs'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/pr-template-rules.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/check-pr-template-rules.mjs'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/pr-template-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check:pr-template-rules
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Verify PR template rules
        run: node scripts/check-pr-template-rules.mjs
