# macOS system proxy comparison (docs/host/personal-migration-release-table.md, row 28, 28b).
#
# Compares the Host's reading of the macOS static system proxy settings (apps/host/src/macos-system-proxy.ts)
# with Electron's session.resolveProxy, under groups of settings the job sets itself.
#
# The job CHANGES THE RUNNER'S SYSTEM PROXY SETTINGS (networksetup with sudo). It therefore runs only on
# GitHub-hosted macOS runners, which are discarded afterwards, and only on demand: started by hand, or for
# a pull request that changes the Electron version. Ordinary pull requests run only the small version check
# below, on Linux. Never change system proxy settings on a development machine or your own computer to
# reproduce it; the script refuses to start anywhere but a GitHub-hosted runner.
name: macOS system proxy comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/package.json'

permissions:
  contents: read

concurrency:
  group: macos-system-proxy-compare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  electron-version:
    name: Electron version changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare the Electron version with the base
        id: compare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          read_version() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log((p.devDependencies||{}).electron||(p.dependencies||{}).electron||"")})'; }
          before="$(git show "$BASE_SHA:apps/desktop/package.json" | read_version)"
          after="$(read_version < apps/desktop/package.json)"
          echo "Electron: ${before:-none} -> ${after:-none}"
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  compare:
    name: Host vs Electron system proxy results
    needs: electron-version
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.electron-version.outputs.changed == 'true') }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      XDT_SKIP_AGENT_BIN_INSTALL: '1'
    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # With the Electron binary: the comparison runs the repository's Electron.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compare (changes this runner's system proxy settings, then restores them)
        working-directory: apps/host
        env:
          CINDY_SYSTEM_PROXY_COMPARE: '1'
        run: node --import tsx --import ./src/loaders/register-raw.mjs scripts/macos-system-proxy-compare.mjs "$RUNNER_TEMP/system-proxy-compare"
      - name: Upload scutil samples and the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-system-proxy-compare
          path: ${{ runner.temp }}/system-proxy-compare
          if-no-files-found: warn
