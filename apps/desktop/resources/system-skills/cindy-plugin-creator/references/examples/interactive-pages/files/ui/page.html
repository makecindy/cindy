<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>交互能力示例</title>
<style>
:root{color-scheme:light dark;--bg:var(--color-background-primary,Canvas);--muted:var(--color-text-secondary,GrayText);--fg:var(--color-text-primary,CanvasText);--panel:var(--color-background-secondary,color-mix(in srgb,CanvasText 5%,Canvas));--line:var(--color-border-primary,color-mix(in srgb,CanvasText 18%,Canvas));--radius:var(--border-radius-md,12px)}
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.5 var(--font-sans,system-ui,sans-serif);color:var(--fg);background:var(--bg);overflow-wrap:anywhere}main{max-width:1040px;margin:auto;min-width:0}h1{font-size:24px;line-height:1.3;font-weight:550;letter-spacing:-.3px;margin:8px 0}h2{font-size:18px;font-weight:550;margin:0}h3{font-size:14px;font-weight:550;margin:0 0 4px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--muted)}p{margin:6px 0 12px;color:var(--muted)}header{padding-bottom:24px}header p{max-width:640px}.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}.chip{font-size:12px;padding:4px 9px;border-radius:9999px;background:var(--panel);color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}.group{min-width:0}.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:4px}.optional{font-size:11px;color:var(--muted);white-space:nowrap}.action{padding:16px 0;min-width:0}.action p{font-size:12px;margin:0 0 8px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}button{font:inherit;font-size:13px;min-height:36px;padding:8px 13px;border-radius:9999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;max-width:100%}button.primary{background:var(--panel);font-weight:600;border-color:transparent}button:hover:enabled{background:var(--panel)}button:focus-visible,input:focus-visible{outline:2px solid var(--color-border-info,var(--fg));outline-offset:2px}button:disabled{opacity:.5;cursor:wait}.result{border-radius:var(--radius);background:var(--panel);padding:10px 12px;min-width:0;font-size:12px}.result-bar{display:flex;align-items:center;gap:8px}.badge{color:var(--muted)}.badge.success{color:var(--color-text-success,var(--fg))}.badge.error{color:var(--color-text-danger,var(--fg))}.badge.running{color:var(--color-text-info,var(--fg))}.elapsed{color:var(--muted);font-variant-numeric:tabular-nums}.copy{margin-left:auto;font-size:11px;min-height:32px;padding:4px 9px;border:0}.result pre{font:11px/1.5 var(--font-mono,ui-monospace,monospace);white-space:pre-wrap;word-break:break-word;margin:6px 0;max-height:72px;overflow:hidden}.result.expanded pre{max-height:none}.expand{font-size:11px;min-height:28px;padding:2px 0;border:0;color:var(--muted)}.empty{color:var(--muted);font:12px/1.5 var(--font-sans,system-ui)!important}input{font:inherit;border:1px solid var(--line);border-radius:8px;color:var(--fg);background:var(--bg);padding:9px 12px;width:100%;min-width:0;min-height:38px}label{font-size:12px;color:var(--muted)}progress{width:100%;height:5px;accent-color:var(--fg);display:block;margin:8px 0}.progress-note{font-size:11px;color:var(--muted)}.dynamic-preview{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:12px 0;overflow-wrap:anywhere}.dynamic-preview h4{font-size:14px;font-weight:600;margin:0 0 8px}.dynamic-preview ul{margin:0;padding-left:20px}.dynamic-preview #dynamic-data{margin:8px 0 0;color:var(--muted)}.preview{aspect-ratio:16/9;width:100%;display:grid;place-items:center;background:var(--panel);border-radius:var(--radius);overflow:hidden;margin:8px 0;color:var(--muted);font-size:12px}.preview img,.preview video{width:100%;height:100%;object-fit:contain}.drop{padding:16px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center;font-size:12px;color:var(--muted);margin:8px 0}.drop:focus-visible{outline:2px solid var(--fg)}footer{border-top:1px solid var(--line);padding:16px 0;margin-top:24px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:600px){body{padding:16px}.grid{grid-template-columns:minmax(0,1fr);gap:24px}h1{font-size:22px}.group-head{gap:4px}}
</style></head><body><main><header><div class="eyebrow">CINDY · MCP APPS</div><h1 id="page-title">交互能力示例</h1><p id="subtitle">一张页面，试遍插件的常用能力。结果留在页面，只有明确点击「发给 AI」才发送选定内容。</p><div class="statusbar"><span class="chip" id="connection">正在连接</span><span class="chip" id="theme">主题 · —</span><span class="chip" id="mode">内联页面</span></div></header><div class="grid" id="groups"></div><footer>内容较多时可以切换全屏。使用前请替换 api.example.com 为自己的后端地址。系统选择和另存为是用户操作；取消调用不会物理关闭已打开的系统面板。</footer></main>
<script>
(()=>{'use strict';
let nextId=0,connected=false,context={},capabilities={},lastImage=null,lastLink=null;
const pending=new Map(),progressTargets=new Map();
const post=m=>parent.postMessage({jsonrpc:'2.0',...m},'*');
const notify=(method,params={})=>post({method,params});
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++nextId;const timer=setTimeout(()=>{pending.delete(id);notify('notifications/cancelled',{requestId:id,reason:'页面等待超时'});reject(new Error('等待超时，请核对结果，不要自动重复写入。'));},30*60*1000);pending.set(id,{resolve,reject,timer});post({id,method,params});});}
function brief(value){return JSON.stringify(value,(k,v)=>/authorization|token|secret|password|cookie/i.test(k)?'[隐藏]':typeof v==='string'?v.replace(/Bearer\s+\S+/gi,'[隐藏]').replace(/\beyJ[\w-]+\.[\w-]+\.[\w-]+\b/g,'[隐藏 JWT]').slice(0,2048):v,2);}
function theme(c){context={...context,...c};if(c.theme)document.documentElement.style.colorScheme=c.theme;for(const[k,v]of Object.entries(c.styles?.variables||{}))if(k.startsWith('--')&&typeof v==='string')document.documentElement.style.setProperty(k,v);document.querySelector('#theme').textContent='主题 · '+(context.theme==='dark'?'深色':'浅色');document.querySelector('#mode').textContent=context.displayMode==='fullscreen'?'全屏页面':'内联页面';}
function showResult(box,state,value,ms){const result=box.querySelector('.result');result.querySelector('.badge').className='badge '+state;result.querySelector('.badge').textContent={success:'成功',error:'失败',running:'进行中',idle:'未运行'}[state];result.querySelector('.elapsed').textContent=ms===undefined?'':(ms/1000).toFixed(2)+' 秒';const pre=result.querySelector('pre');pre.classList.remove('empty');pre.textContent=brief(value);result.querySelector('.expand').hidden=pre.textContent.length<180&&pre.textContent.split('\n').length<5;}
function setProgress(box,p){const bar=box.querySelector('progress');bar.hidden=false;if(p.total>0){bar.max=p.total;bar.value=p.progress;}else bar.removeAttribute('value');box.querySelector('.progress-note').textContent=p.message||'正在处理';}
function previews(result){for(const c of result?.content||[]){if(c.type!=='resource_link')continue;lastLink=c;const file=c._meta?.['cindy/file'];if(c.uri?.startsWith('cindy-media://')&&c.mimeType?.startsWith('image/'))lastImage=c;if(!file?.url)continue;const type=file.mimeType||c.mimeType;const slot=document.querySelector(type?.startsWith('video/')?'#video-preview':'#image-preview');if(!slot||!/^image\/|^video\//.test(type))continue;const media=document.createElement(type.startsWith('video/')?'video':'img');if(media.tagName==='VIDEO')media.controls=true;else media.alt=c.name||'本卡图片';media.onerror=()=>{slot.replaceChildren(document.createTextNode('预览不可用，请重新选择文件。'));};media.src=file.url;slot.replaceChildren(media);}}
async function tool(box,name,args={},fullResult=false){const token='progress-'+(++nextId);progressTargets.set(token,box);try{const r=await rpc('tools/call',{name,arguments:args,_meta:{progressToken:token}});previews(r);if(r.isError)throw new Error((r.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n')||'工具返回错误');return fullResult?r:r._meta?.showcase??r.structuredContent??r;}finally{progressTargets.delete(token);}}
function readable(message){const text=String(message||'操作失败');if(text.includes('MCP_APP_TOOL_NOT_VISIBLE'))return '页面不能调用仅向模型开放的工具（MCP_APP_TOOL_NOT_VISIBLE）。';if(text==='CANCELLED')return '你已取消操作，未继续处理文件（CANCELLED）。';if(text==='BUSY')return '系统选择框仍在使用中，请关闭后再试（BUSY）。';return text.split('\n    at ')[0].slice(0,500);}
const groups=document.querySelector('#groups');
function group(title){const el=document.createElement('section');el.className='group';el.innerHTML='<div class="group-head"><h2></h2><span class="optional">不需要可以删</span></div>';el.querySelector('h2').textContent=title;groups.append(el);return el;}
function action(g,id,title,desc,buttons,extra=''){
 const box=document.createElement('section');box.className='action';box.id=id;box.innerHTML='<h3></h3><p></p>'+extra+'<div class="buttons"></div><progress hidden></progress><div class="progress-note"></div><div class="result"><div class="result-bar"><span class="badge">未运行</span><span class="elapsed"></span><button class="copy" type="button">复制</button></div><pre class="empty">点击上方按钮查看结果</pre><button class="expand" hidden>展开结果</button></div>';box.querySelector('h3').textContent=title;box.querySelector('p').textContent=desc;
 for(const spec of buttons){const b=document.createElement('button');b.textContent=spec.label;b.disabled=!connected;if(spec.primary)b.className='primary';b.dataset.action=spec.key||id;b.onclick=()=>run(box,b,spec.run,spec.request);box.querySelector('.buttons').append(b);}
 box.querySelector('.copy').onclick=async()=>{const text=box.querySelector('pre').textContent;try{await navigator.clipboard.writeText(text);box.querySelector('.copy').textContent='已复制';}catch{const range=document.createRange();range.selectNodeContents(box.querySelector('pre'));getSelection().removeAllRanges();getSelection().addRange(range);box.querySelector('.copy').textContent='已选中，请复制';}};
 box.querySelector('.expand').onclick=e=>{const r=box.querySelector('.result');r.classList.toggle('expanded');e.target.textContent=r.classList.contains('expanded')?'收起结果':'展开结果';};g.append(box);return box;
}
async function run(box,button,fn,request){const started=performance.now();const label=button.textContent;button.disabled=true;button.textContent='处理中…';showResult(box,'running',{request:request||label});try{const value=await fn(box);const failed=(value?.status>=400)||!!value?.errorCode;showResult(box,failed?'error':'success',{request:request||label,response:value},performance.now()-started);box.querySelector('.progress-note').textContent=failed?'请求结束，对方返回错误':'已完成';}catch(e){showResult(box,'error',{request:request||label,message:readable(e.message)},performance.now()-started);box.querySelector('.progress-note').textContent='操作结束';}finally{box.querySelector('progress').hidden=true;button.textContent=label;button.disabled=!connected;}}
const call=(name,args={})=>box=>tool(box,name,args);
const basic=group('01 · 基础');
 action(basic,'form','打开与表单回写','只回写页面，不发给模型。',[{label:'保存表单',primary:true,run:b=>tool(b,'save_form',{title:document.querySelector('#title-input').value})},{label:'重新读取初始状态',run:call('open_showcase')}],'<label>计划标题<input id="title-input" value="我的交互实验" maxlength="160"></label>');
 // 本例片段来自 main.js 中固定的可信内容，不能用不可信 HTML 替换；见手册 §4.23。
 async function renderDynamic(box,intent){
  const r=await tool(box,'dynamic_content',{intent},true);
  box.querySelector('#fragment').innerHTML=r._meta.html;
  box.querySelector('#dynamic-data').textContent='已完成 '+r.structuredContent.completed+' / '+r.structuredContent.total+' 项';
  return r.structuredContent;
 }
 action(basic,'dynamic','动态内容','同一模板按意图切换内容。本机模拟后端，无需联网或配置凭证。',[{label:'查看概览',primary:true,run:b=>renderDynamic(b,'overview')},{label:'查看明细',run:b=>renderDynamic(b,'details')}],'<div class="dynamic-preview" aria-live="polite"><div id="fragment">选择概览或明细，查看动态内容</div><p id="dynamic-data"></p></div>');
 action(basic,'display','显示模式与主题','浅色 / 深色跟随宿主；内容较多时建议全屏。',[{label:'切换全屏',run:()=>rpc('ui/request-display-mode',{mode:context.displayMode==='fullscreen'?'inline':'fullscreen'})},{label:'查看主题变量',run:async()=>({theme:context.theme,displayMode:context.displayMode,variables:context.styles?.variables||{},hostCapabilities:capabilities})}]);
 action(basic,'message','消息与上下文','更新上下文只提交计划标题；不会把联网结果发给 AI。',[{label:'发文字给 AI',run:()=>rpc('ui/message',{role:'user',content:[{type:'text',text:'我在交互能力示例里填写的计划标题是：'+document.querySelector('#title-input').value}]})},{label:'更新模型上下文',run:()=>rpc('ui/update-model-context',{structuredContent:{title:document.querySelector('#title-input').value}})}]);
 action(basic,'denied','工具可见性边界','预期失败：model-only 工具不允许页面调用。',[{label:'尝试调用 model-only',run:call('model_only')}]);
 action(basic,'long','长任务进度','约 8 秒，标准 notifications/progress；不要把心跳当成完成。',[{label:'运行长任务',run:call('slow_task')}]);
 const files=group('02 · 文件');
 action(files,'pick','系统选择与本卡预览','选择自己的演示图片 / 视频 / 附件。文件只读地址由宿主签发，不显示绝对路径。',[{label:'选择图片',primary:true,run:call('file_action',{action:'pick',kind:'image'})},{label:'选择视频',run:call('file_action',{action:'pick',kind:'video'})},{label:'选择附件',run:call('file_action',{action:'pick',kind:'attachment'})}],'<div class="preview" id="image-preview">图片预览 · 尚未选择</div><div class="preview" id="video-preview">视频预览 · 尚未选择</div>');
 const drop=action(files,'drop','拖入 / 粘贴分片导入','演示限 16 MiB，原始字节每片 1 MiB；更大文件用系统选择框。',[], '<div class="drop" id="drop-target" tabindex="0">把图片拖到这里，或先点击这里再粘贴</div>');
 const dropTarget=drop.querySelector('.drop');
 async function importFile(file){if(!file||dropTarget.getAttribute('aria-busy')==='true')return;dropTarget.setAttribute('aria-busy','true');const b=document.createElement('button');b.textContent='分片导入';drop.querySelector('.buttons').append(b);await run(drop,b,async box=>{if(file.size>16*1024*1024)throw new Error('演示拖放限 16 MiB');let stream;try{stream=(await tool(box,'file_action',{action:'begin',name:file.name,size:file.size,mimeType:file.type})).streamId;let seq=1;for(let offset=0;offset<file.size;offset+=1024*1024){const bytes=new Uint8Array(await file.slice(offset,offset+1024*1024).arrayBuffer());let str='';for(let i=0;i<bytes.length;i+=8192)str+=String.fromCharCode(...bytes.subarray(i,i+8192));await tool(box,'file_action',{action:'chunk',streamId:stream,seq:seq++,data:btoa(str)});setProgress(box,{progress:Math.min(file.size,offset+bytes.length),total:file.size,message:'正在导入本机作品库'});}return await tool(box,'file_action',{action:'commit',streamId:stream});}catch(e){if(stream)await tool(box,'file_action',{action:'abort',streamId:stream}).catch(()=>{});throw e;}},{name:file.name,bytes:file.size});b.remove();dropTarget.setAttribute('aria-busy','false');}
 dropTarget.ondragover=e=>e.preventDefault();dropTarget.ondrop=e=>{e.preventDefault();if(connected)void importFile(e.dataTransfer.files[0]);};dropTarget.onpaste=e=>{if(e.clipboardData.files[0]){e.preventDefault();if(connected)void importFile(e.clipboardData.files[0]);}};
 action(files,'download','下载与另存为','下载到本插件 Library，显示状态码和前 2 KB 文本；再另存到用户选择的位置。',[{label:'下载后端附件',run:call('download_file')},{label:'Library 另存为',run:call('save_file')}]);
 action(files,'export','标准下载与上传','下载草案方法 ui/download-file 由宿主弹另存为；上传显示真实读取进度与发送阶段。',[{label:'导出页面文字',run:()=>rpc('ui/download-file',{contents:[{type:'resource',resource:{uri:'ui://showcase/export.txt',mimeType:'text/plain',text:'页面导出：'+document.querySelector('#title-input').value}}]})},{label:'导出已引用文件',run:()=>{if(!lastLink)throw new Error('请先选择或下载文件');return rpc('ui/download-file',{contents:[{type:'resource_link',uri:lastLink.uri,name:lastLink.name,mimeType:lastLink.mimeType}]});}},{label:'处理后上传',run:call('upload_file',{kind:'library'})}]);
 action(files,'send-image','让 AI 看到图片','仅发送本卡选择 / 导入的一张图片；不会发送其它按钮的结果。',[{label:'把图发给 AI',run:()=>{if(!lastImage)throw new Error('请先选图或拖入图片');return rpc('ui/message',{role:'user',content:[{type:'text',text:'请查看我在交互页面选择的这张图片。'},{type:'resource_link',uri:lastImage.uri,name:lastImage.name,mimeType:lastImage.mimeType}]});}}]);
 const host=group('03 · 宿主能力');
 action(host,'workdir','任务工作目录','写入 tmp/ui-showcase-page.txt；询问模式下由原有能力关口确认。',[{label:'写演示文件',primary:true,run:call('write_task')}]);
 action(host,'settings','参数与设置','kv 计数只存在本插件；设置来自插件详情，绝不读取凭证。',[{label:'kv 计数 +1 并读回',run:call('kv_demo')},{label:'读取非敏感设置',run:call('read_settings')}]);
 action(host,'uploads','两种既有上传入口','upload.hashes 上传本插件媒体；uploadDir 亲选测试目录后消费一次性票据。',[{label:'upload_hash',run:call('upload_file',{kind:'hash'})},{label:'upload_dir',run:call('upload_file',{kind:'directory'})}]);
 action(host,'legacy','旧版聊天卡与图卡','旧卡片走模型 ghost_call 路径。按钮发送请求，结果显示在对话中，不假装页面能直接挂载旧卡。',[{label:'请 AI 展示 HTML 卡',run:()=>rpc('ui/message',{role:'user',content:[{type:'text',text:'请用acme-ui-showcase 插件调用 legacy_cards，展示旧版 HTML 聊天卡。这是页面发出的演示请求。'}]})},{label:'请 AI 展示图卡',run:()=>rpc('ui/message',{role:'user',content:[{type:'text',text:'请用acme-ui-showcase 插件调用 image_card，展示旧版图卡。这是页面发出的演示请求。'}]})}]);
 const network=group('04 · 联网');
 action(network,'network','普通后端请求','先在插件详情配置自己的后端凭证。响应只显示状态码和截断正文，不回显请求头。',[{label:'请求后端',primary:true,run:call('network_probe',{kind:'user'})}]);
 action(network,'unauthorized','401 对照','由自己的后端提供固定返回 401 的接口；用于对照状态码和安全的错误正文，不自动重试。',[{label:'查看 401 响应',run:call('network_probe',{kind:'unauthorized'})}]);
addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;const m=e.data;const item=pending.get(m.id);if(item){pending.delete(m.id);clearTimeout(item.timer);m.error?item.reject(new Error(m.error.message||'请求被拒绝')):item.resolve(m.result);return;}if(m.method==='ui/notifications/host-context-changed')theme(m.params||{});else if(m.method==='notifications/progress'){const box=progressTargets.get(m.params?.progressToken);if(box)setProgress(box,m.params);}else if(m.method==='ui/notifications/tool-result'){const box=document.querySelector('#form');showResult(box,'success',{initial:m.params?._meta?.showcase??m.params?.structuredContent??{ready:true}});previews(m.params);}else if(m.method==='ui/resource-teardown'){connected=false;for(const[id,p]of pending){clearTimeout(p.timer);p.reject(new Error('页面已关闭，结果不再交付。'));}pending.clear();post({id:m.id,result:{}});}else if(m.method==='ui/notifications/tool-cancelled')document.querySelector('#connection').textContent='调用已取消';});
rpc('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'交互能力示例',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}}).then(r=>{capabilities=r.hostCapabilities||{};theme(r.hostContext||{});notify('ui/notifications/initialized');connected=true;document.querySelector('#connection').textContent='已连接';for(const b of document.querySelectorAll('.buttons button'))b.disabled=false;if(!capabilities.downloadFile){for(const b of document.querySelectorAll('#export .buttons button'))if(b.textContent.startsWith('导出')){b.disabled=true;b.title='当前查看端不支持文件导出，请在执行电脑操作';}}let previous=0;new ResizeObserver(()=>{const height=Math.ceil(document.body.getBoundingClientRect().height);if(height!==previous){previous=height;notify('ui/notifications/size-changed',{height});}}).observe(document.body);}).catch(e=>{document.querySelector('#connection').textContent='连接失败：'+e.message;});
})();
</script></body></html>
