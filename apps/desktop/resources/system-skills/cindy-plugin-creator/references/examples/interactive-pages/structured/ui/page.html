<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>记录</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;padding:20px;font:14px/1.5 var(--font-sans,system-ui);color:var(--color-text-primary,CanvasText);background:var(--color-background-primary,Canvas)}
h1{font-size:20px;font-weight:500}h1,dt,dd,p{overflow-wrap:anywhere}dt{font-weight:600}dd{margin:4px 0 16px}
</style>
<h1 id="title">记录</h1>
<p id="status" role="status">正在连接…</p>
<dl id="rows"></dl>
<script type="module">
import { App } from '@modelcontextprotocol/ext-apps';
const app = new App({ name: '记录', version: '1.0.0' }, {}, { autoResize: true });
const status = document.querySelector('#status');
function theme(context) {
  if (context.theme) document.documentElement.style.colorScheme = context.theme;
  for (const [key, value] of Object.entries(context.styles?.variables ?? {}))
    document.documentElement.style.setProperty(key, value);
}
// 这是宿主直接加载的包内页面，不是加载器 document.write 换出的新文档。
app.ontoolresult = result => {
  const view = result._meta?.view;
  if (result.isError || !view) {
    status.textContent = result.content?.find(item => item.type === 'text')?.text || '没有可显示的记录。';
    return;
  }
  document.querySelector('#title').textContent = view.title;
  const list = document.querySelector('#rows');
  list.replaceChildren();
  for (const row of view.rows) {
    const name = document.createElement('dt'), value = document.createElement('dd');
    name.textContent = row.name; value.textContent = row.value;
    list.append(name, value);
  }
  status.textContent = '';
};
app.onhostcontextchanged = () => theme(app.getHostContext() ?? {});
try { await app.connect(); theme(app.getHostContext() ?? {}); }
catch { status.textContent = '无法连接，请检查 Cindy 版本。'; }
</script>
</html>
