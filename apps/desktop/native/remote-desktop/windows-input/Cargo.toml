[package]
name = "cindy-windows-desktop-input"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_StationsAndDesktops", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
