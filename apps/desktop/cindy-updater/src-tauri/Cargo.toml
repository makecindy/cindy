[package]
name = "cindy-updater"
version = "0.1.0"
edition = "2021"
description = "Windows updater for Cindy"
license = "Apache-2.0"

[[bin]]
name = "cindy-updater"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.32"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
thiserror = "2"
open = "5"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Used by installer::self_elevate (ShellExecuteExW runas),
# process_is_elevated (OpenProcessToken / TokenElevation), High-IL
# staging ACLs, and CreateProcessWithTokenW de-elevation. Keep the
# feature set to the modules whose symbols we touch.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # SHELLEXECUTEINFOW carries an HKEY field (hkeyClass) and so the type
    # itself is gated behind the Registry feature in windows-sys 0.59 even
    # though we never touch the registry. Required transitively.
    "Win32_System_Registry",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
