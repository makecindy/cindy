<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cindy 更新</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card">
      <header class="header" data-tauri-drag-region>
        <h1 id="title" class="title" data-tauri-drag-region>Cindy 更新</h1>
        <span id="phase-chip" class="chip phase-waiting">等待</span>
      </header>

      <p id="message" class="message">正在准备更新…</p>

      <div class="spacer"></div>

      <div id="progress-track" class="progress-track">
        <div id="progress-fill" class="progress-fill" data-state="indeterminate"></div>
      </div>

      <div id="error-bar" class="error-bar" hidden>
        <p id="error-text" class="error-text"></p>
      </div>

      <footer class="footer">
        <button id="btn-retry" type="button" class="btn" hidden></button>
        <button id="btn-log" type="button" class="btn">打开日志文件夹</button>
        <button id="btn-quit" type="button" class="btn" hidden>关闭</button>
      </footer>
    </main>

    <script src="./retry-copy.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
