appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- takeScreenshot:
    path: visual-devices
- assertVisible:
    id: "home.chromeMenu"
- tapOn:
    id: "home.chromeMenu"
- assertVisible:
    id: "devices.settingsButton"
- tapOn:
    id: "devices.settingsButton"
- extendedWaitUntil:
    visible:
      id: "settings.screen"
    timeout: 10000
- assertVisible:
    id: "settings.accountHeader"
- assertVisible:
    id: "settings.version"
- takeScreenshot:
    path: visual-settings
- tapOn:
    id: "settings.backButton"
- extendedWaitUntil:
    visible:
      id: "devices.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "home.projectSessionRow"
    timeout: 15000
- tapOn:
    id: "home.projectSessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- assertVisible:
    id: "session.messageList"
- assertVisible:
    id: "session.summary"
- takeScreenshot:
    path: visual-session
- tapOn:
    id: "session.controlsToggle"
- assertVisible:
    id: "session.menuSheet"
- assertVisible:
    id: "session.menuSheetBody"
- takeScreenshot:
    path: visual-session-controls
- tapOn:
    id: "session.settingsBackdrop"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 10000
- tapOn:
    id: "session.backButton"
- extendedWaitUntil:
    visible:
      id: "devices.screen"
    timeout: 10000
