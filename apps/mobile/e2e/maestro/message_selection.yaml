appId: ${APP_ID}
---
- runFlow: login_mock.yaml
- runFlow: open_session_no_launch.yaml
# 完成态消息正文是原生 selectable Text:长按文字就地弹系统选择菜单,复制不离开会话页。
- extendedWaitUntil:
    visible:
      id: "message.markdownBody"
    timeout: 10000
- longPressOn:
    id: "message.markdownBody"
    index: 0
- extendedWaitUntil:
    visible:
      text: "^Copy$"
    timeout: 5000
- tapOn:
    text: "^Copy$"
