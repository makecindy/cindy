appId: ${APP_ID}
---
- runFlow: login_mock.yaml
- tapOn:
    id: "home.chromeMenu"
- tapOn:
    id: "home.chromeDrawer.devices"
- extendedWaitUntil:
    visible:
      id: "deviceManagement.open.${XDT_MOBILE_E2E_HOST_DEVICE_ID}"
    timeout: 15000
- tapOn:
    id: "deviceManagement.open.${XDT_MOBILE_E2E_HOST_DEVICE_ID}"
- extendedWaitUntil:
    visible:
      id: "deviceInformation.screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "deviceInformation.tasks"
    direction: DOWN
- tapOn:
    id: "deviceInformation.tasks"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.screen"
    timeout: 15000
- assertVisible:
    id: "deviceDetail.toolbarActions"
- tapOn:
    id: "deviceDetail.searchToggleButton"
- assertVisible:
    id: "deviceDetail.searchInput"
- tapOn:
    id: "deviceDetail.filtersToggleButton"
- assertVisible:
    id: "deviceDetail.statusFilter.active"
- assertVisible:
    id: "deviceDetail.statusFilter.archived"
- assertVisible:
    id: "deviceDetail.statusFilter.all"
- tapOn:
    id: "deviceDetail.statusFilter.automation"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.automationGroupRow"
    timeout: 10000
- tapOn:
    id: "deviceDetail.automationGroupRow"
- assertVisible:
    id: "deviceDetail.automationGroupChildren"
- assertVisible:
    id: "deviceDetail.automationGroupChild"
- tapOn:
    id: "deviceDetail.statusFilter.active"
- longPressOn:
    id: "deviceDetail.sessionRow"
- assertVisible:
    id: "deviceDetail.selectionBar"
- assertVisible:
    id: "deviceDetail.selectionHeaderActions"
- assertVisible:
    id: "deviceDetail.bulkPrimaryActions"
- assertVisible:
    id: "deviceDetail.bulkPinButton"
- assertVisible:
    id: "deviceDetail.bulkArchiveButton"
- assertVisible:
    id: "deviceDetail.bulkDangerActions"
- assertVisible:
    id: "deviceDetail.bulkDeleteButton"
- tapOn:
    id: "deviceDetail.bulkArchiveButton"
- assertVisible:
    id: "deviceDetail.bulkConfirmCard"
- assertVisible:
    id: "deviceDetail.bulkConfirmActions"
- assertVisible:
    id: "deviceDetail.bulkConfirmButton"
- tapOn:
    id: "deviceDetail.bulkConfirmCancelButton"
- tapOn:
    id: "deviceDetail.clearSelectionButton"
