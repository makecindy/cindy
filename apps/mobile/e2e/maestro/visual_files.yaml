appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- extendedWaitUntil:
    visible:
      id: "home.sessionRowTitle.mock-session-1"
    timeout: 15000
- tapOn:
    id: "home.sessionRowTitle.mock-session-1"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- tapOn:
    id: "session.filesButton"
- extendedWaitUntil:
    visible:
      id: "files.screen"
    timeout: 10000
- assertVisible:
    id: "files.navRow"
- tapOn:
    id: "files.titleMenuButton"
- tapOn:
    id: "files.menu.view.list"
- extendedWaitUntil:
    visible:
      id: "files.row.about.txt"
    timeout: 10000
- takeScreenshot:
    path: visual-files
- tapOn:
    id: "files.row.about.txt"
- extendedWaitUntil:
    visible:
      id: "filePreview.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "filePreview.sourceReady"
    timeout: 10000
- takeScreenshot:
    path: visual-files-preview
