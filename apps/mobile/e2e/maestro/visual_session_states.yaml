appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
# 设备详情从左侧菜单的设备管理进入；标题下拉只负责筛选。
- tapOn:
    id: "home.chromeMenu"
- tapOn:
    id: "home.chromeDrawer.devices"
- extendedWaitUntil:
    visible:
      id: "deviceManagement.open.${XDT_MOBILE_E2E_HOST_DEVICE_ID}"
    timeout: 15000
- tapOn:
    id: "deviceManagement.open.${XDT_MOBILE_E2E_HOST_DEVICE_ID}"
- extendedWaitUntil:
    visible:
      id: "deviceInformation.screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "deviceInformation.tasks"
    direction: DOWN
- tapOn:
    id: "deviceInformation.tasks"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.screen"
    timeout: 15000
- tapOn:
    id: "deviceDetail.searchToggleButton"
- assertVisible:
    id: "deviceDetail.searchInput"

- tapOn:
    id: "deviceDetail.searchInput"
- eraseText
- inputText: "Visual Idle"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.sessionRow"
    timeout: 10000
- tapOn:
    id: "deviceDetail.sessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "deviceDetail.sessionRow"
    commands:
      - tapOn:
          id: "deviceDetail.sessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "session.messageList"
    timeout: 15000
- assertVisible:
    id: "session.composer"
- takeScreenshot:
    path: visual-session-idle
- tapOn:
    id: "session.backButton"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.screen"
    timeout: 15000

- tapOn:
    id: "deviceDetail.searchInput"
- eraseText
- inputText: "Visual Running"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.sessionRow"
    timeout: 10000
- tapOn:
    id: "deviceDetail.sessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "deviceDetail.sessionRow"
    commands:
      - tapOn:
          id: "deviceDetail.sessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "session.messageList"
    timeout: 15000
- assertVisible:
    text: "Visual Running Session"
- takeScreenshot:
    path: visual-session-running
- tapOn:
    id: "session.backButton"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.screen"
    timeout: 15000

- tapOn:
    id: "deviceDetail.searchInput"
- eraseText
- inputText: "Visual Queue"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.sessionRow"
    timeout: 10000
- tapOn:
    id: "deviceDetail.sessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "deviceDetail.sessionRow"
    commands:
      - tapOn:
          id: "deviceDetail.sessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- runFlow:
    when:
      visible: "同步失败"
    commands:
      - tapOn:
          id: "connection.syncButton"
# 排队消息 inline 在消息流末尾,无需打开面板。
- extendedWaitUntil:
    visible:
      id: "queue.inline.section"
    timeout: 15000
- takeScreenshot:
    path: visual-session-queue
- tapOn:
    id: "session.backButton"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.screen"
    timeout: 15000

- tapOn:
    id: "deviceDetail.searchInput"
- eraseText
- inputText: "Visual Pending"
- extendedWaitUntil:
    visible:
      id: "deviceDetail.sessionRow"
    timeout: 10000
- tapOn:
    id: "deviceDetail.sessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "deviceDetail.sessionRow"
    commands:
      - tapOn:
          id: "deviceDetail.sessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- runFlow:
    when:
      visible: "同步失败"
    commands:
      - tapOn:
          id: "connection.syncButton"
- extendedWaitUntil:
    visible:
      id: "interaction.bottomSurface"
    timeout: 15000
- assertVisible:
    id: "interaction.permission.card"
- takeScreenshot:
    path: visual-session-pending
