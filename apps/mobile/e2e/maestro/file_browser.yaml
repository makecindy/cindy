appId: ${APP_ID}
---
- runFlow: login_mock.yaml
- runFlow: open_session_no_launch.yaml
- tapOn:
    id: "session.filesButton"
- extendedWaitUntil:
    visible:
      id: "files.screen"
    timeout: 10000
- assertVisible:
    id: "files.navRow"
- assertVisible:
    id: "files.title"
- assertVisible:
    id: "files.summary"
- tapOn:
    id: "files.titleMenuButton"
- tapOn:
    id: "files.menu.view.list"
- extendedWaitUntil:
    visible:
      id: "files.row.about.txt"
    timeout: 10000
- tapOn:
    id: "files.row.about.txt"
- extendedWaitUntil:
    visible:
      id: "filePreview.screen"
    timeout: 10000
- assertVisible:
    id: "filePreview.title"
- extendedWaitUntil:
    visible:
      id: "filePreview.sourceReady"
    timeout: 10000
- tapOn:
    id: "filePreview.copyPath"
- assertVisible:
    id: "filePreview.notice"
