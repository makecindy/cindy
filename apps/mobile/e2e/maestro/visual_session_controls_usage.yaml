appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- extendedWaitUntil:
    visible:
      id: "home.sessionRowTitle.mock-session-1"
    timeout: 15000
- tapOn:
    id: "home.sessionRowTitle.mock-session-1"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- tapOn:
    id: "session.controlsToggle"
- extendedWaitUntil:
    visible:
      id: "session.menuSheet"
    timeout: 10000
- tapOn:
    id: "session.menuUsageRow"
- extendedWaitUntil:
    visible:
      id: "session.infoSheet"
    timeout: 10000
- assertVisible:
    id: "session.contextRefreshButton"
- assertVisible:
    id: "session.worktreeStatus"
- assertVisible:
    id: "session.openWorkspaceButton"
- takeScreenshot:
    path: visual-session-controls-usage
