appId: ${APP_ID}
---
- assertVisible:
    id: "session.screen"
# 排队消息 inline 在消息流末尾:轻点气泡展开操作行,编辑走底部 composer。
- extendedWaitUntil:
    visible:
      id: "queue.inline.section"
    timeout: 10000
- tapOn:
    id: "queue.inline.bubble.1"
- extendedWaitUntil:
    visible:
      id: "queue.inline.actions.1"
    timeout: 10000
- tapOn:
    id: "queue.inline.edit.1"
- extendedWaitUntil:
    visible:
      id: "session.queueEditBar"
    timeout: 10000
- tapOn:
    id: "session.composerInput"
- eraseText
- inputText: "First queue edit"
- hideKeyboard
- tapOn:
    id: "session.sendButton"
- extendedWaitUntil:
    notVisible:
      id: "session.queueEditBar"
    timeout: 10000
- tapOn:
    id: "queue.inline.bubble.1"
- extendedWaitUntil:
    visible:
      id: "queue.inline.actions.1"
    timeout: 10000
- tapOn:
    id: "queue.inline.edit.1"
- extendedWaitUntil:
    visible:
      id: "session.queueEditBar"
    timeout: 10000
- tapOn:
    id: "session.composerInput"
- eraseText
- inputText: "Second queue edit"
- hideKeyboard
- tapOn:
    id: "session.sendButton"
- extendedWaitUntil:
    visible: "Second queue edit"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "session.queueEditBar"
    timeout: 10000
- tapOn:
    id: "queue.inline.bubble.1"
- extendedWaitUntil:
    visible:
      id: "queue.inline.actions.1"
    timeout: 10000
- tapOn:
    id: "queue.inline.edit.1"
- extendedWaitUntil:
    visible:
      id: "session.queueEditBar"
    timeout: 10000
- tapOn:
    id: "session.queueEditCancel"
- extendedWaitUntil:
    notVisible:
      id: "session.queueEditBar"
    timeout: 10000
- assertVisible:
    id: "session.screen"
