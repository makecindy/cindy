appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- extendedWaitUntil:
    visible:
      id: "home.sessionRowTitle.mock-session-1"
    timeout: 15000
- tapOn:
    id: "home.sessionRowTitle.mock-session-1"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- tapOn:
    id: "session.controlsToggle"
- extendedWaitUntil:
    visible:
      id: "session.menuUsageRow"
    timeout: 10000
- assertVisible:
    id: "session.renameAction"
- assertVisible:
    id: "session.copyLinkAction"
- assertVisible:
    id: "session.pinButton"
- assertVisible:
    id: "session.archiveButton"
- assertVisible:
    id: "session.deleteButton"
- takeScreenshot:
    path: visual-session-controls-session
- tapOn:
    id: "session.renameAction"
- assertVisible:
    id: "session.renameInput"
- assertVisible:
    id: "session.renameButton"
- assertVisible:
    id: "session.renameCancelButton"
- takeScreenshot:
    path: visual-session-controls-rename
# Exercise real taps while the keyboard is up; an accessibility-visible editor
# alone does not catch a footer that overflows its native sheet viewport.
- tapOn:
    id: "session.renameCancelButton"
- assertNotVisible:
    id: "session.renameInput"
- tapOn:
    id: "session.renameAction"
- tapOn:
    id: "session.renameButton"
- assertNotVisible:
    id: "session.renameInput"
- tapOn:
    id: "session.renameAction"
- hideKeyboard
- assertVisible:
    id: "session.renameButton"
- assertVisible:
    id: "session.renameCancelButton"
- takeScreenshot:
    path: visual-session-controls-rename-keyboard-hidden
- tapOn:
    id: "session.renameCancelButton"
- assertNotVisible:
    id: "session.renameInput"
