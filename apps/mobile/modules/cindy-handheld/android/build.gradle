plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.cindy.handheld'
version = '0.1.0'

dependencies {
  implementation 'com.facebook.react:react-android'
}

android {
  namespace 'com.cindy.handheld'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.1.0'
  }
}
