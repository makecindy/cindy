plugins { id 'com.android.application' version '8.12.0'; id 'org.jetbrains.kotlin.android' version '2.1.20' }
android {
 namespace 'expo.modules.cindyquotawidget'
 compileSdk 36
 buildToolsVersion "36.0.0"
 defaultConfig { applicationId 'org.cindy.quota.validation'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.0' }
 sourceSets.main {
  java.srcDirs += 'src/production'
  res.srcDirs += 'src/main/res'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}
